<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VIBEBALL</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,calc(100vh * 4 / 3));aspect-ratio:4/3;background:#000}
  body.touch{align-items:flex-start}
  body.touch #wrap{width:100vw;height:100vh;aspect-ratio:auto}   /* tela no ecrã todo: espaço por baixo para a pega e o dedo */
  canvas{display:block;width:100%;height:100%;cursor:none;touch-action:none;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';

/* =========================================================================
   VIBEBALL — jogo em HTML5 (inspirado no Curveball)
   Mundo 3D: túnel com x ∈ [-TX,TX], y ∈ [-TY,TY], z ∈ [0,TD]
   z = 0 → plano do jogador (frente) | z = TD → plano do adversário (fundo)
   ========================================================================= */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// --- Geometria -----------------------------------------------------------
const TX = 1.0, TY = 0.75;               // meia-largura, meia-altura
const TD_BASE = 2.2;
let TD = TD_BASE, TD_TARGET = TD_BASE;    // profundidade do túnel (muda aleatoriamente a cada nível)
// comprimento sorteado entre 1,2 e 4,6 (o normal é 2,2), sempre bem diferente do anterior
function tunnelInfo(d) {
  if (d < 1.45) return { name: 'TÚNEL MÍNIMO', sub: 'Reflexos puros' };
  if (d < 1.8)  return { name: 'TÚNEL MUITO CURTO', sub: 'A bola chega num instante' };
  if (d < 2.05) return { name: 'TÚNEL CURTO', sub: 'Menos tempo para reagir' };
  if (d < 2.45) return { name: 'TÚNEL NORMAL', sub: '' };
  if (d < 2.95) return { name: 'TÚNEL LONGO', sub: 'As curvas ficam mais abertas' };
  if (d < 3.6)  return { name: 'TÚNEL MUITO LONGO', sub: 'Curvas enormes' };
  return { name: 'TÚNEL GIGANTE', sub: 'O adversário quase desaparece' };
}
// cor da bola: muda a cada nível (sem vermelhos/laranjas, reservados ao adversário e ao fogo)
const BALL_HUES = [100, 185, 45, 270, 315, 60, 160, 220];
let ballHue = 100, ballHueTarget = 100;
function newBallHue(prev) {
  const opts = BALL_HUES.filter(h => Math.abs(h - prev) > 25);
  return opts[Math.floor(Math.random() * opts.length)];
}
function newTunnel(prev) {
  let d;
  do { d = Math.round((1.2 + Math.random() * 3.4) * 20) / 20; } while (Math.abs(d - prev) < 0.45);
  return d;
}
const CAM = 1.05;                        // distância da câmara ao plano frontal
const PW = 0.21, PH = 0.18;              // semi-eixos da cabeça oval das raquetes
const BR = 0.065;                        // raio da bola
const LX = TX - BR, LY = TY - BR;        // limites do centro da bola
const PX = TX - PW, PY = TY - PH;        // limites do centro das raquetes

// --- Física --------------------------------------------------------------
const DEFLECT    = 1.15;   // velocidade lateral máxima dada pelo ponto de impacto (borda da raquete)
const CURVE_K    = 0.55;   // aceleração lateral (efeito Magnus) por unidade de velocidade da raquete
const CMAX       = 4.2;    // aceleração de curva máxima
const VMAX       = 2.8;    // velocidade lateral máxima
const SPIN_DECAY = 0.22;   // perda de rotação no ar (por segundo)
const SUBSTEP    = 1 / 240;
const MAX_LIVES  = 15;     // máximo de bolas acumuláveis (ases + níveis concluídos)

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);

// --- Ecrã / projeção -----------------------------------------------------
let W = 800, H = 600, K = 1, CX = 400, CY = 300;
function resize() {
  const r = cv.getBoundingClientRect();
  W = r.width; H = r.height;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (document.body.classList.contains('touch')) {
    // ecrã tátil: a tela ocupa o ecrã todo; o túnel fica em cima e por baixo sobra espaço
    // para a pega comprida e para o dedo (que fica exatamente na ponta da pega)
    const top = H * 0.90;
    K = Math.min(W / (2 * TX), top / (2 * TY)) * 0.985;
    CX = W / 2; CY = top / 2;
  } else {
    K = Math.min(W / (2 * TX), H / (2 * TY)) * 0.985;
    CX = W / 2; CY = H / 2;
  }
}
window.addEventListener('resize', resize);
resize();

// projeção em perspetiva verdadeira
function P(x, y, z) {
  const s = CAM / (CAM + z);
  return { x: CX + x * s * K, y: CY + y * s * K, s };
}

// --- Estado --------------------------------------------------------------
const G = {
  mode: 'title',          // title | serve | play | miss | gameover
  score: 0, hi: 0, level: 1, lives: 5, opp: 3, rally: 0,
  timer: 0, after: null, paused: false, muted: false,
  banner: null, pops: [], served: 0, overAt: 0
};
try { G.hi = +localStorage.getItem('vibeball_hi') || +localStorage.getItem('curveball_hi') || 0; } catch (e) {}

const ball = { x: 0, y: 0, z: BR, vx: 0, vy: 0, vz: 0, cx: 0, cy: 0, rot: 0, visible: true };
const me = { x: 0, y: 0, vx: 0, vy: 0, gx: 0, gy: 0 };   // g = memória curta do gesto (orienta a face)
const op = { x: 0, y: 0, vx: 0, vy: 0, ex: 0, ey: 0, fx: 0, fy: 0 };
const input = { x: 0, y: 0, fx: 0, fy: 0, touch: false, down: false };
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) { document.body.classList.add('touch'); resize(); }

// --- Entrada (rato / toque) ---------------------------------------------
const samples = [];  // histórico de posições da raquete para medir a velocidade do gesto
function toWorld(ev) {
  const r = cv.getBoundingClientRect();
  const sx = (ev.clientX - r.left) * (W / r.width);
  const sy = (ev.clientY - r.top) * (H / r.height);
  return { x: (sx - CX) / K, y: (sy - CY) / K };
}
// ---- Toque: o dedo segura a raquete pela PEGA, a cabeça fica acima do dedo e à vista ----
const HANDLE_L_TOUCH = 0.17;          // pega normal
const GRIP_V = 0.18 + HANDLE_L_TOUCH + 0.012;   // = ponta final da pega      // distância do centro da cabeça ao ponto da pega onde está o dedo
const TOUCH_GAIN_Y = 1, TOUCH_GAIN_X = 1;   // 1:1 → o dedo fica exatamente na ponta da pega // pequeno ganho vertical para a cabeça alcançar o fundo do túnel
// vetor (no ecrã) do centro da cabeça até à pega, segundo a orientação atual da raquete
function gripOffset() {
  // deslocamento FIXO (dedo diretamente abaixo da raquete): assim a raquete não "salta"
  // quando roda entre direita e esquerda; a haste desenhada liga a pega ao dedo
  return { x: 0, y: GRIP_V };
}
// posição da cabeça da raquete a partir do ponteiro
function headFrom(fx, fy) {
  if (!input.touch) return { x: fx, y: fy };
  const g = gripOffset();
  return { x: fx * TOUCH_GAIN_X - g.x, y: fy * TOUCH_GAIN_Y - g.y };
}
// ---- Rato: bloqueio do ponteiro (Pointer Lock) ----
// Com o rato bloqueado o jogo lê apenas o MOVIMENTO: não há cursor a bater nas bordas do ecrã
// nem "zona morta" ao inverter o sentido junto aos limites. Esc liberta o rato (e pausa).
// Sem bloqueio (plano B): ganho de 1,15 → a raquete chega aos limites antes de o cursor chegar à borda.
const LOCK = { on: false, x: 0, y: 0, lostAt: 0, since: 0, ax: 0, ay: 0, pending: false };
const NO_LOCK = /nolock/.test(location.search);   // ?nolock desativa o bloqueio (testes)
// testes: ?modo=alvo|penaltis|squash|rede|disco|crono força esse modo em todos os níveis; ?nivel=N começa no nível N
const QS = new URLSearchParams(location.search);
const FORCE_MODE = QS.get('modo') || null;
const START_LEVEL = Math.max(1, parseInt(QS.get('nivel')) || 1);
const FORCE_IDX = { squash: 0, penaltis: 1, rede: 2, disco: 3, crono: 4, alvo: 5 }[FORCE_MODE];
const MOUSE_GAIN = 1.15, MOUSE_SENS = 1.1;
function requestLock() {
  if (NO_LOCK || document.pointerLockElement === cv || !cv.requestPointerLock) return;
  // ponto de partida: onde a raquete está no momento do clique (alguns navegadores enviam movimentos falsos ao bloquear)
  LOCK.ax = clamp(input.x, -PX, PX); LOCK.ay = clamp(input.y, -PY, PY); LOCK.pending = true;
  try { const pr = cv.requestPointerLock(); if (pr && pr.catch) pr.catch(() => { LOCK.pending = false; }); } catch (e) { LOCK.pending = false; }
}
document.addEventListener('pointerlockchange', () => {
  LOCK.on = document.pointerLockElement === cv;
  if (LOCK.on) { LOCK.x = LOCK.ax; LOCK.y = LOCK.ay; LOCK.since = performance.now(); LOCK.pending = false; pushWorld(LOCK.x, LOCK.y, false); }
  else if (G.mode === 'play' || G.mode === 'serve' || G.mode === 'miss') { G.paused = true; LOCK.lostAt = performance.now(); }
});
function pushWorld(x, y, touch) {
  input.touch = touch;
  input.fx = x; input.fy = y;
  const h = headFrom(x, y);
  input.x = h.x; input.y = h.y;
  samples.push({ t: performance.now(), x: clamp(h.x, -PX, PX), y: clamp(h.y, -PY, PY) });
  if (samples.length > 64) samples.shift();
}
function pushSample(ev) {
  const touch = ev.pointerType === 'touch' || ev.pointerType === 'pen';
  if (!touch && !LOCK.on && document.pointerLockElement === cv) {   // bloqueio já ativo, aviso ainda a caminho
    LOCK.on = true; LOCK.x = LOCK.ax; LOCK.y = LOCK.ay; LOCK.since = performance.now(); LOCK.pending = false;
  }
  if (!touch && LOCK.pending && !LOCK.on && performance.now() - LOCK.since > 0 && ev.type === 'pointermove' && ev.clientX === 0 && ev.clientY === 0) return;
  if (LOCK.on && !touch) {
    // movimento relativo, limitado ao alcance da raquete (sem zona morta)
    // alguns navegadores enviam um salto falso ao bloquear: ignora o arranque e saltos absurdos
    const mx = ev.movementX || 0, my = ev.movementY || 0;
    if (performance.now() - LOCK.since < 80 || Math.abs(mx) > 250 || Math.abs(my) > 250) return;
    const r = cv.getBoundingClientRect(), sc = (W / r.width) / K * MOUSE_SENS;
    LOCK.x = clamp(LOCK.x + mx * sc, -PX, PX);
    LOCK.y = clamp(LOCK.y + my * sc, -PY, PY);
    pushWorld(LOCK.x, LOCK.y, false);
    return;
  }
  const p = toWorld(ev);
  if (!touch) { p.x *= MOUSE_GAIN; p.y *= MOUSE_GAIN; }
  pushWorld(p.x, p.y, touch);
}
window.addEventListener('pointermove', e => {
  if (!e.isPrimary) return;                          // só o primeiro dedo move a raquete
  if (LOCK.on) { pushSample(e); return; }            // bloqueado: o evento principal já soma o movimento
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (list && list.length) for (const ev of list) pushSample(ev); else pushSample(e);
});
window.addEventListener('pointerup', e => { if (e.isPrimary) input.down = false; });
window.addEventListener('pointercancel', e => { if (e.isPrimary) input.down = false; });

// velocidade da raquete (unidades do mundo por segundo) nos últimos ~50 ms
function paddleVel() {
  const now = performance.now();
  while (samples.length && now - samples[0].t > 140) samples.shift();
  if (samples.length < 2) return { x: 0, y: 0 };
  const a = samples[samples.length - 1];
  if (now - a.t > 60) return { x: 0, y: 0 };          // rato parado
  let b = samples[0];
  for (let i = samples.length - 2; i >= 0; i--) {
    if (a.t - samples[i].t >= 50) { b = samples[i]; break; }
  }
  const dt = Math.max((a.t - b.t) / 1000, 0.012);
  return { x: (a.x - b.x) / dt, y: (a.y - b.y) / dt };
}

window.addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  unlockAudio();
  const touch = e.pointerType === 'touch' || e.pointerType === 'pen';
  if (e.isPrimary) {
    if (touch) samples.length = 0;   // novo toque: a raquete "salta" para o dedo sem contar como golpe
    pushSample(e);
    input.down = true;
  }
  if (!touch) requestLock();         // clique: o jogo captura o rato
  if (G.paused) { G.paused = false; return; }
  if (G.mode === 'title') { newGame(); return; }
  if (G.mode === 'gameover') { if (performance.now() - G.overAt > 900) newGame(); return; }
  // no toque, o primeiro dedo só agarra a raquete; um toque com um 2.º dedo serve / remata
  if (touch && e.isPrimary) return;
  if (touch) { secondFinger(); return; }
  if (G.mode === 'serve' && G.server !== 'op') serve();
  else if (G.mode === 'play') strike();
});
window.addEventListener('contextmenu', e => e.preventDefault());
// 2.º dedo em QUALQUER parte do ecrã: serve / remata. Os eventos de toque servem de reserva,
// porque alguns Android tratam dois dedos como gesto de zoom e não entregam o pointerdown.
let lastSecond = 0;
function secondFinger() {
  const now = performance.now();
  if (now - lastSecond < 120) return;   // evita contar o mesmo toque duas vezes
  lastSecond = now;
  unlockAudio();
  if (G.paused) { G.paused = false; return; }
  if (G.mode === 'serve' && G.server !== 'op') serve();
  else if (G.mode === 'play') strike();
}
document.addEventListener('touchstart', e => {
  if (e.touches.length >= 2) { e.preventDefault(); secondFinger(); }
}, { passive: false });
document.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'p' || k === 'escape') {
    if (k === 'escape' && performance.now() - LOCK.lostAt < 400) return;   // o Esc já libertou o rato e pausou
    if (G.mode === 'play' || G.mode === 'serve' || G.mode === 'miss') G.paused = !G.paused;
  } else if (k === 'm') {
    setMuted(!G.muted);
  } else if (k === ' ') {
    e.preventDefault();
    unlockAudio();
    if (G.mode === 'serve' && G.server !== 'op' && !G.paused) serve();
    else if (G.mode === 'play' && !G.paused) strike();
    else if (G.mode === 'title') newGame();
  }
});
window.addEventListener('blur', () => { if (G.mode === 'play' || G.mode === 'serve') G.paused = true; });

// --- Som (sintetizado em tempo real: impacto, ressonância, atrito, distância e estéreo) ---
let MLP = null, AC = null, MASTER = null, NOISE = null, PINK = null, FLY = null, VERB = null, lastWall = 0;
// swoosh gravado (fornecido pelo utilizador), embutido em base64 — mono, 1,05 s
let SWOOSH = null, SW_PEAK = 0.48, CONV = null;
// reverberação do túnel: túnel curto = seco e curto; túnel gigante = longo e cavernoso
function buildVerb(depth) {
  if (!AC || !CONV) return;
  try {
    const T = 0.7 + Math.max(0, depth - 1.2) * 0.65;          // tempo de decaimento (≈0,7 s … 2,9 s)
    const sr = AC.sampleRate, len = Math.floor(sr * T * 1.15);
    const ir = AC.createBuffer(2, len, sr);
    const echo = 0.018 * depth;                                  // reflexões entre as paredes do túnel
    for (let ch = 0; ch < 2; ch++) {
      const dd = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const tt = i / sr;
        dd[i] = (Math.random() * 2 - 1) * Math.exp(-tt * 6.9 / T) * (tt < 0.015 ? tt / 0.015 : 1) * 0.6;
      }
      for (let k = 1; k <= 6; k++) {                              // ecos discretos que se repetem
        const at = Math.floor((echo * k + (ch ? 0.004 : 0)) * sr);
        if (at < len) dd[at] += 0.7 * Math.exp(-echo * k * 6.9 / T) * (k % 2 ? 1 : -1);
      }
    }
    CONV.buffer = ir;
  } catch (e) {}
}
// quantidade de eco enviada: cresce com o comprimento do túnel

function loadHit() {
  try {
    const bin = atob(HIT_B64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    AC.decodeAudioData(u8.buffer, buf => { HITBUF = buf; }, () => {});
  } catch (e) {}
}
function loadSwoosh() {
  try {
    const bin = atob(SWOOSH_B64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    AC.decodeAudioData(u8.buffer, buf => {
      SWOOSH = buf;
      // instante do pico de energia, para o fazer coincidir com a pancada
      const d = buf.getChannelData(0), w = Math.floor(buf.sampleRate * 0.02);
      let best = 0, bi = 0;
      for (let i = 0; i + w < d.length; i += w) {
        let e = 0; for (let j = i; j < i + w; j++) e += d[j] * d[j];
        if (e > best) { best = e; bi = i; }
      }
      SW_PEAK = (bi + w / 2) / buf.sampleRate;
    }, () => {});
  } catch (e) {}
}
const VOL = 0.9;
function unlockAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4;
      comp.attack.value = 0.002; comp.release.value = 0.12;
      MASTER = AC.createGain(); MASTER.gain.value = G.muted ? 0 : VOL;
      MLP = AC.createBiquadFilter(); MLP.type = 'lowpass'; MLP.frequency.value = 20000; MLP.Q.value = 0.7;
      MASTER.connect(MLP); MLP.connect(comp); comp.connect(AC.destination);
      // ruído branco reutilizável (estalidos, atrito, ar)
      NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = NOISE.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // ruído rosa (mais suave e "arejado" do que o branco) para os sons de ar
      PINK = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const pk = PINK.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < pk.length; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
        pk[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
      }
      // eco do túnel (reverberação sintética, estéreo) — refeita a cada nível conforme o comprimento
      CONV = AC.createConvolver();
      const vlp = AC.createBiquadFilter(); vlp.type = 'lowpass'; vlp.frequency.value = 3400;
      VERB = AC.createGain(); VERB.gain.value = 0.7;
      VERB.connect(CONV); CONV.connect(vlp); vlp.connect(MASTER);
      buildVerb(TD_TARGET);
      loadSwoosh();
      loadHit();
      FLY = null;   // sem som contínuo de voo: o ar ouve-se em "whooshes" curtos (swing e passagem da bola)
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function setMuted(m) {
  G.muted = m;
  if (MASTER) MASTER.gain.setTargetAtTime(m ? 0 : VOL, AC.currentTime, 0.02);
}
const audioOn = () => AC && MASTER && !G.muted;

// cadeia de saída: distância (0 = junto a ti, 1 = fundo do túnel) abafa e baixa o som; pan = posição lateral
function out(pan = 0, dist = 0) {
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.value = 15000 * Math.pow(0.22, dist);
  const g = AC.createGain(); g.gain.value = 1 / (1 + dist * 1.8);
  lp.connect(g);
  if (VERB) { const sd = AC.createGain(); sd.gain.value = (0.1 + dist * 0.15) * verbScale(); g.connect(sd); sd.connect(VERB); }
  if (AC.createStereoPanner) {
    const p = AC.createStereoPanner(); p.pan.value = clamp(pan, -1, 1) * 0.75;
    g.connect(p); p.connect(MASTER);
  } else g.connect(MASTER);
  return lp;
}
function noise(dst, t, type, f, q, dur, vol, f2) {
  const s = AC.createBufferSource(); s.buffer = NOISE;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.003, dur * 0.2));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(dst);
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.02);
}
function tone(dst, t, type, f0, f1, dur, vol, attack = 0.002) {
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dst);
  o.start(t); o.stop(t + dur + 0.02);
}
// sino (parciais inarmónicas) para avisos de pontuação
function bell(dst, t, f, dur, vol) {
  tone(dst, t, 'sine', f, f, dur, vol, 0.004);
  tone(dst, t, 'sine', f * 2.756, f * 2.756, dur * 0.45, vol * 0.3, 0.004);
  tone(dst, t, 'sine', f * 5.404, f * 5.404, dur * 0.2, vol * 0.12, 0.004);
}

      if (mine && HITBUF) {
        // a tua raquetada: som gravado de ténis (volume e tom conforme a força)
        const src = AC.createBufferSource(); src.buffer = HITBUF;
        src.playbackRate.value = pf;
        const g = AC.createGain(); g.gain.value = 0.55 + 0.45 * clamp(power, 0, 1.5);
        src.connect(g); g.connect(out(ball.x / TX, 0));
        src.start(t);
        if (spin > 0.5) {
          const sN = Math.min(1, spin / CMAX);
          noise(dst, t + 0.006, 'bandpass', 3600, 0.8, 0.05 + sN * 0.07, 0.04 + sN * 0.12, 2000);
        }
        return;
      }
      noise(dst, t, 'bandpass', 1900 * pf, 0.9, 0.018, 0.5 * v);                    // estalo das cordas
      noise(dst, t + 0.002, 'lowpass', 900, 0.7, 0.03, 0.3 * v);                    // feltro da bola
      tone(dst, t, 'sine', (mine ? 300 : 170) * pf, (mine ? 230 : 105) * pf, 0.06, (mine ? 0.18 : 0.5) * v, 0.002);   // "pock" (sem baque de tambor)
      tone(dst, t, 'triangle', 540 * pf, 500 * pf, 0.16, 0.2 * v, 0.003);           // cordame a vibrar
      tone(dst, t, 'sine', 1150 * pf, 1090 * pf, 0.09, 0.07 * v, 0.003);            // harmónico das cordas
      if (spin > 0.5) {                                                              // cordas a raspar a bola (efeito)
        const sN = Math.min(1, spin / CMAX);
        noise(dst, t + 0.006, 'bandpass', 3600, 0.8, 0.05 + sN * 0.07, 0.05 + sN * 0.18, 2000);
      }
    } catch (e) {}
  },

  // ressalto na parede: mais seco e agudo; volume pela velocidade de impacto, abafado com a profundidade
  wall(imp) {
    if (!audioOn()) return;
    const n = performance.now(); if (n - lastWall < 35) return; lastWall = n;
    try {
      const t = AC.currentTime + 0.001;
      const dist = clamp(ball.z / TD, 0, 1);
      const dst = out(ball.x / TX, dist);
      const v = clamp(imp / 2.2, 0.12, 0.85);
      const f = 1050 * (0.95 + Math.random() * 0.1);
      noise(dst, t, 'bandpass', 2600, 1.4, 0.016, 0.45 * v);
      tone(dst, t, 'sine', f * 1.2, f, 0.055, 0.38 * v);
      tone(dst, t, 'sine', f * 2.4, f * 2.3, 0.025, 0.12 * v);
    } catch (e) {}
  },
  // "whoosh": SÓ AR — ruído rosa filtrado, entrada que cresce e fade longo, sem tons nem ataques secos.
  // power 0..1.5 · pan · dist (0 = junto a ti, 1 = fundo) · pitch · dir (sentido do gesto) · len · att (s até ao pico)
  whoosh(power, pan = 0, dist = 0, pitch = 1, dir = 0, len = 1, att) {
    if (!audioOn() || power <= 0.05) return;
    try {
      const t = AC.currentTime + 0.001;
      const p = clamp(power, 0, 1.5);
      const dur = (0.5 + p * 0.35) * len;
      const at = att !== undefined ? att : (0.11 + p * 0.04) * len;
      const lpD = AC.createBiquadFilter(); lpD.type = 'lowpass'; lpD.frequency.value = 15000 * Math.pow(0.22, dist);
      const gD = AC.createGain(); gD.gain.value = 1 / (1 + dist * 1.8);
      lpD.connect(gD);
      let node = gD;
      if (AC.createStereoPanner) {
        const pn = AC.createStereoPanner();
        pn.pan.setValueAtTime(clamp(pan - dir * 0.55, -1, 1) * 0.85, t);
        pn.pan.linearRampToValueAtTime(clamp(pan + dir * 0.55, -1, 1) * 0.85, t + at + (dur - at) * 0.5);
        gD.connect(pn); node = pn;
      }
      node.connect(MASTER);
      if (VERB) { const send = AC.createGain(); send.gain.value = (0.4 + p * 0.15) * verbScale(); node.connect(send); send.connect(VERB); }
      // som gravado: o pico do swoosh cai 'att' segundos depois (na pancada)
      if (SWOOSH) {
        const rate = clamp(1.15 - p * 0.2, 0.85, 1.2) * pitch * rnd(0.97, 1.03);
        const lead = att !== undefined ? att : 0.12;
        const off = Math.max(0, SW_PEAK - lead * rate);
        const src = AC.createBufferSource(); src.buffer = SWOOSH; src.playbackRate.value = rate;
        const g = AC.createGain(), vol = (0.08 + 0.18 * p) * len;
        if (off > 0.05) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.035); }
        else g.gain.setValueAtTime(vol, t);
        // sem graves: o sopro não se mistura com a raquetada (evita o efeito de "batuque")
        const hpw = AC.createBiquadFilter(); hpw.type = 'highpass'; hpw.frequency.value = 450; hpw.Q.value = 0.6;
        src.connect(hpw); hpw.connect(g); g.connect(lpD);
        src.start(t, off);
        return;
      }
      // (alternativa sintetizada, enquanto o som gravado não estiver carregado)
      // entrada em curva suave (sem arestas) e fade longo
      const env = (g, peak) => {
        g.gain.setValueAtTime(0.0001, t);
        g.gain.setTargetAtTime(peak, t, at / 2.2);
        g.gain.setTargetAtTime(0.0001, t + at, (dur - at) / 3.2);
      };
      const layer = (q, f0, f1, f2, lpf, peak) => {
        const src = AC.createBufferSource(); src.buffer = PINK || NOISE;
        const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
        bp.frequency.setValueAtTime(f0 * pitch, t);
        bp.frequency.exponentialRampToValueAtTime(f1 * pitch, t + at);
        bp.frequency.exponentialRampToValueAtTime(f2 * pitch, t + dur);
        const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpf; lp.Q.value = 0.3;
        const g = AC.createGain(); env(g, peak);
        src.connect(bp); bp.connect(lp); lp.connect(g); g.connect(lpD);
        src.start(t, Math.random() * 1.2); src.stop(t + dur + 0.1);
      };
      // um único sopro, grave e abafado (sem camada aguda, que soava a shaker/percussão)
      layer(0.5, 260, 620 + p * 260, 180, 1300 + p * 250, 0.32 + p * 0.38);
    } catch (e) {}
  },
  // falhaste: a bola passa por ti com um sopro e soa o aviso grave
  lose() {
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.001;
      const dst = out(ball.x / TX, 0);
      noise(dst, t, 'bandpass', 2200, 1.2, 0.35, 0.5, 250);
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(dst);
      tone(lp, t + 0.18, 'sawtooth', 196, 98, 0.55, 0.22, 0.01);
      tone(lp, t + 0.18, 'sawtooth', 147, 73, 0.6, 0.16, 0.01);
    } catch (e) {}
  },
  // ponto teu: a bola some ao fundo e soa um sino
  win() {
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.001;
      noise(out(ball.x / TX, 1), t, 'bandpass', 900, 1, 0.25, 0.25, 300);
      const dst = out(0, 0);
      bell(dst, t + 0.05, 880, 0.5, 0.22);
      bell(dst, t + 0.16, 1318.5, 0.7, 0.2);
    } catch (e) {}
  },
  extra() {
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.25, dst = out(0, 0);
      [1046.5, 1318.5, 1568].forEach((f, i) => bell(dst, t + i * 0.07, f, 0.35, 0.14));
    } catch (e) {}
  },
  level() {
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.001, dst = out(0, 0);
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(dst, t + i * 0.12, f, 0.6, 0.2));
    } catch (e) {}
  },
  // curto-circuito: crepitar elétrico aos solavancos + zumbido de corrente + estalo final
  shortCircuit(segs) {
    if (!audioOn()) return;
    try {
      const t0 = AC.currentTime + 0.01;
      const dst = out(rnd(-0.6, 0.6), 0.3);
      // zumbido (corrente a 100 Hz) que acompanha as quebras
      const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 100;
      const bpz = AC.createBiquadFilter(); bpz.type = 'bandpass'; bpz.frequency.value = 700; bpz.Q.value = 1.2;
      const gz = AC.createGain(); gz.gain.setValueAtTime(0.0001, t0);
      o.connect(bpz); bpz.connect(gz); gz.connect(dst);
      let t = t0;
      for (const sg of segs) {
        if (sg.dark > 0.3) {
          gz.gain.setValueAtTime(0.05 + sg.dark * 0.07, t);
          // estalidos dentro da quebra
          const n = 2 + Math.floor(sg.d * 40);
          for (let i = 0; i < n; i++) noise(dst, t + Math.random() * sg.d, 'highpass', rnd(2500, 6000), 0.7, rnd(0.008, 0.03), rnd(0.12, 0.35));
        } else gz.gain.setValueAtTime(0.0001, t);
        t += sg.d;
      }
      gz.gain.setValueAtTime(0.0001, t);
      o.start(t0); o.stop(t + 0.05);
      // estalo de quando a luz volta
      noise(dst, t, 'bandpass', 1800, 0.8, 0.06, 0.45);
      tone(dst, t, 'square', 1400, 180, 0.09, 0.08);
    } catch (e) {}
  },
  // tempo-bala: o mundo abranda (som abafado e grave)
  matrixIn() {
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.01;
      if (MLP) { MLP.frequency.cancelScheduledValues(t); MLP.frequency.setValueAtTime(MLP.frequency.value, t); MLP.frequency.exponentialRampToValueAtTime(520, t + 0.4); }
      this.whoosh(1.2, 0, 0, 0.42, 0, 1.4, 0.35);
      const dst = out(0, 0);
      tone(dst, t, 'sine', 90, 42, 1.7, 0.22, 0.25);          // queda grave do tempo a parar
      tone(dst, t + 0.45, 'sine', 55, 55, 1.2, 0.08, 0.3);    // zumbido suspenso
    } catch (e) {}
  },
  // explosão: o tempo volta de repente e a bola dispara
  matrixOut() {
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.005;
      if (MLP) { MLP.frequency.cancelScheduledValues(t); MLP.frequency.setValueAtTime(MLP.frequency.value, t); MLP.frequency.exponentialRampToValueAtTime(20000, t + 0.08); }
      const dst = out(ball.x / TX, 0.2);
      noise(dst, t, 'lowpass', 900, 0.7, 0.55, 0.9, 120);     // estrondo
      noise(dst, t, 'bandpass', 2600, 0.8, 0.12, 0.5);         // estalo
      tone(dst, t, 'sine', 110, 32, 0.6, 0.45, 0.004);         // impacto grave
      this.whoosh(1.5, ball.x / TX, 0.2, 1.15, 0, 1, 0.06);
    } catch (e) {}
  },
  net() {
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.001, dst = out(ball.x / TX, 0.45);
      noise(dst, t, 'lowpass', 700, 0.7, 0.14, 0.45);           // bola a bater na malha
      noise(dst, t + 0.01, 'bandpass', 2400, 1.2, 0.09, 0.12);  // malha a vibrar
      tone(dst, t, 'sine', 140, 90, 0.12, 0.15, 0.003);
    } catch (e) {}
  },
  boomerang(dur) {
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.01, half = dur * 0.47;
      const src = AC.createBufferSource(); src.buffer = PINK || NOISE; src.loop = true;
      const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.2;
      bp.frequency.setValueAtTime(1300, t);
      bp.frequency.exponentialRampToValueAtTime(520, t + half);     // afasta-se: mais grave (Doppler)
      bp.frequency.exponentialRampToValueAtTime(1600, t + dur);     // regressa: mais agudo
      const am = AC.createGain(); am.gain.value = 0.55;              // modulação = rotação
      const lfo = AC.createOscillator(); lfo.type = 'triangle';
      lfo.frequency.setValueAtTime(14, t); lfo.frequency.linearRampToValueAtTime(9, t + half); lfo.frequency.linearRampToValueAtTime(16, t + dur);
      const ld = AC.createGain(); ld.gain.value = 0.45; lfo.connect(ld); ld.connect(am.gain);
      const g = AC.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.9, t + 0.08);
      g.gain.exponentialRampToValueAtTime(0.06, t + half);          // quase some ao longe
      g.gain.exponentialRampToValueAtTime(1.0, t + dur);            // volta forte
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.35);
      const dst = out(0, 0);
      src.connect(bp); bp.connect(am); am.connect(g); g.connect(dst);
      src.start(t); lfo.start(t); src.stop(t + dur + 0.4); lfo.stop(t + dur + 0.4);
    } catch (e) {}
  },
  goal() {   // golo: a bola estica a rede (sopro + rede a sacudir) e depois os sinos
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.001, pn = ball.x / TX, d = out(pn, 0.45);
      noise(d, t, 'bandpass', 2600, 0.6, 0.45, 0.55, 1200);             // "chuac" da bola na rede
      noise(d, t, 'lowpass', 260, 0.7, 0.18, 0.5, 120);                  // baque surdo
      for (let i = 0; i < 6; i++)                                        // rede a sacudir: pequenos roçares a desvanecer
        noise(d, t + 0.09 + i * 0.075 + Math.random() * 0.03, 'bandpass', rnd(2200, 4200), 1.2, 0.09, 0.32 * Math.pow(0.72, i));
      const dst = out(0, 0);
      [659.25, 830.6, 987.8].forEach((f, i) => bell(dst, t + 0.32 + i * 0.09, f, 0.6, 0.16));
    } catch (e) {}
  },
  target(pts) {   // bola cravada no alvo: pancada seca + vibração; o centro dá um sino
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.001, d = out(ball.x / TX, 0.5);
      noise(d, t, 'lowpass', 1400, 0.8, 0.09, 0.8, 300); tone(d, t, 'sine', 210, 120, 0.25, 0.5);
      tone(d, t + 0.01, 'triangle', 95, 88, 0.4, 0.18);                       // vibração do alvo
      if (pts === 10) { const dst = out(0, 0); [880, 1318.5, 1760].forEach((f, i) => bell(dst, t + 0.12 + i * 0.08, f, 0.7, 0.16)); }
      else if (pts >= 6) bell(out(0, 0), t + 0.1, 880 + pts * 40, 0.4, 0.1);
    } catch (e) {}
  },
  tick(last) {   // tique-taque dos últimos segundos
    if (!audioOn()) return;
    try { const t = AC.currentTime + 0.001, d = out(0, 0); tone(d, t, 'square', last ? 2200 : 1600, last ? 2200 : 1600, 0.035, 0.12); noise(d, t, 'highpass', 5000, 0.7, 0.02, 0.15); } catch (e) {}
  },
  timeUp() {     // tempo esgotado: buzina curta
    if (!audioOn()) return;
    try { const t = AC.currentTime + 0.001, d = out(0, 0); tone(d, t, 'sawtooth', 220, 180, 0.35, 0.16); tone(d, t, 'sawtooth', 233, 190, 0.35, 0.12); } catch (e) {}
  },
  woodwork() {   // bola no poste/trave: "clang" metálico com ressonância
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.001, d = out(ball.x / TX, 0.35);
      noise(d, t, 'bandpass', 1800, 0.9, 0.05, 0.7);
      [[587, 1.1, 0.34], [1497, 0.7, 0.2], [2561, 0.45, 0.13], [3912, 0.25, 0.08], [5220, 0.15, 0.05]]
        .forEach(([f, du, v]) => tone(d, t, 'sine', f, f * 0.995, du, v, 0.002));
    } catch (e) {}
  },
  over() {
    if (!audioOn()) return;
    try {
      const t = AC.currentTime + 0.001, dst = out(0, 0);
      [392, 329.63, 261.63, 196].forEach((f, i) => bell(dst, t + i * 0.22, f, 0.9, 0.24));
    } catch (e) {}
  }
};

// sopro contínuo da bola em voo: mais forte e agudo quando se aproxima de ti
// sons de ar por acontecimento: bola a passar junto a ti e gestos muito rápidos no ar
// sons de ar: o swing começa antes do contacto e atinge o pico na pancada
let armMe = true, armOp = true, lastSwingWhoosh = 0;
const WH_LEAD = 0.3;   // começa até 0,3 s antes, com o pico exatamente no contacto
function updateFlightSound() {
  if (!AC) return;
  const now = performance.now();
  if (G.mode === 'play' && !G.paused) {
    if (SQUASH) {
      if (ball.vz > 0) { armMe = true; armOp = true; }
      else if (G.turn === 'op') {
        const tco = (ball.z - SQZ) / -ball.vz;
        if (armOp && tco < WH_LEAD) { armOp = false; sfx.whoosh(0.5, op.x / TX, 0.25, 1, 0, 0.9, Math.max(0.02, tco - 0.07)); }
      }
    }
    if (SQUASH && G.turn !== 'me') {}
    else if (ball.vz < 0) {
      armOp = true;
      const tcm = ball.z / -ball.vz;
      if (armMe && tcm < WH_LEAD) {
        armMe = false; lastSwingWhoosh = now;
        const v = strokeGesture(), pw = strokePower(v), sm = rigMe.smash > 0;
        sfx.whoosh(sm ? 1.5 : 0.35 + pw * 0.95, me.x / TX, 0, sm ? 0.88 : 1,
                   Math.sign(v.x) * Math.min(1, Math.abs(v.x) / 4), 1, Math.max(0.02, tcm - 0.07));
      }
    } else if (ball.vz > 0) {
      armMe = true;
      const tco = (TD - ball.z) / ball.vz;
      if (armOp && tco < WH_LEAD) {
        armOp = false;
        sfx.whoosh(G.oppAttack ? 0.9 : 0.4, op.x / TX, 0.85, 1, 0, 0.9, tco);
      }
    }
  } else { armMe = armOp = true; }
  // gesto muito rápido no ar
  const gs = Math.hypot(me.vx, me.vy);
  if ((G.mode === 'play' || G.mode === 'serve') && gs > 7 && now - lastSwingWhoosh > 700) {
    lastSwingWhoosh = now;
    sfx.whoosh(clamp((gs - 6) / 8, 0.1, 0.5), me.x / TX, 0, 1, Math.sign(me.vx) * Math.min(1, Math.abs(me.vx) / 4), 0.8);
  }
}

// --- Lógica de jogo ------------------------------------------------------
function speed() {
  // a velocidade acompanha parcialmente o comprimento do túnel
  const base = Math.min(1.85 + 0.17 * (G.level - 1), 4.8) * (1 + 0.012 * OVR(G.level)) * Math.pow(TD / TD_BASE, TUN.speedExp);
  // squash: o percurso é o dobro (ida à parede e volta) → bola mais rápida
  return base * (SQUASH ? 1.45 : 1) * (1 + Math.min(G.rally, 12) * 0.025);   // a bola acelera ligeiramente durante a jogada
}
function setCurve(cx, cy) {
  const m = Math.hypot(cx, cy);
  if (m > CMAX) { cx *= CMAX / m; cy *= CMAX / m; }
  ball.cx = cx; ball.cy = cy;
}
function newAIError() {
  const e = Math.max(0.03, 0.17 - 0.013 * G.level);
  op.ex = rnd(-e, e); op.ey = rnd(-e, e);
}
function banner(text, sub, dur = 1.4, color = '#e8fff0') {
  G.banner = { text, sub, t: 0, dur, color };
}
function pop(text, color = '#9dff5a') {
  return;   // sem mensagens flutuantes (o jogo fala por si)
  G.pops.push({ text, color, t: 0 });
  if (G.pops.length > 4) G.pops.shift();
}
function addScore(n) {
  G.score += n;
  if (G.score > G.hi) { G.hi = G.score; try { localStorage.setItem('vibeball_hi', String(G.hi)); } catch (e) {} }
}

function newGame() {
  G.nextServer = 'me';
  glitch.on = false; glitch.timer = rnd(20, 35); glitch.sparks.length = 0;
  TD = TD_TARGET = TD_BASE;
  ballHue = ballHueTarget = 100;
  themeIdx = 0; themePending = null; visIdx = 1; visPending = null; NET = null;
  buildVerb(TD_BASE);
  shotMemory.length = 0; op.fam = 0;
  G.score = 0; G.level = START_LEVEL; G.lives = 5; G.opp = 3; G.rally = 0; G.aces = 0; G.aceRun = 0; G.pm = 0; G.po = 0; G.levelLosses = 0;
  SQUASH = false; squashPending = false; PENALTY = false; penPending = false; penReset(); DISCO = false; discoPending = false; TIMED = false; timedPending = false; TM.kind = ''; TARGET = false; targetPending = false; tgReset();
  if (FORCE_IDX !== undefined) {                  // modo forçado (testes): já desde o primeiro nível
    const mi = FORCE_IDX;
    SQUASH = squashPending = mi === 0; PENALTY = penPending = mi === 1;
    NET = netPending = mi === 2 ? { top: TY - 0.42 } : null;
    DISCO = discoPending = mi === 3; TIMED = timedPending = mi === 4; TARGET = targetPending = mi === 5;
  }
  G.pops.length = 0; G.served = 0;
  op.x = op.y = 0;
  banner('NÍVEL ' + G.level, '', 1.4);
  toServe();
}
function toServe(keepFaults) {
  G.boom = null; G.boomUsed = false; G.boomBonus = false;
  G.toss = null; PEN.rip = null; PEN.netBall = false;
  if (!keepFaults) G.faults = 0;
  MX.arm = null; MX.used = false;
  if (MX.on) { MX.on = false; MX.scale = 1; if (MLP && AC) MLP.frequency.setTargetAtTime(20000, AC.currentTime, 0.05); }
  fire.k = 0;
  G.mode = 'serve';
  G.rally = 0;
  ball.vx = ball.vy = ball.vz = 0; ball.cx = ball.cy = 0;
  ball.visible = true;
  // a bola fica parada no centro do plano frontal; a raquete move-se livremente
  G.server = PENALTY ? PEN.turn : TARGET ? 'me' : (G.nextServer || 'me');
  TG.stuck = null;
  ball.x = 0; ball.y = 0; ball.z = BR + 0.005;
  if (G.server === 'op') { ball.z = SQUASH ? SQZ + BR + 0.01 : TD - BR - 0.005; G.opServe = { t: rnd(0.9, 1.4), toss: false, vy: 0 }; }
}
// força do golpe a partir do gesto: 0 = raquete parada (bloqueio), 1 = gesto rápido (ataque)
function strokePower(v) { return clamp(Math.hypot(v.x, v.y) / 6, 0, 1); }

// direção e velocidade de saída: a bola sai segundo a face da raquete (ângulo do gesto e da posição),
// corrigida pelo ponto de impacto; o gesto dá potência e efeito
function launch(px, py, v, mul, keep) {
  const ox = clamp((ball.x - px) / PW, -1, 1);
  const oy = clamp((ball.y - py) / PH, -1, 1);
  const aim = faceAim(px, py, me.gx, me.gy);      // a mesma inclinação que se vê na face
  ball.vz = speed() * mul;
  // colocação: o ponto da raquete onde bates define o ângulo (como no Pong/Curveball original);
  // a inclinação da face (gesto e posição) acrescenta um pouco; o gesto dá sobretudo efeito e força
  ball.vx = ball.vx * keep * 0.5 + ox * DEFLECT * 0.95 + Math.tan(aim.ax) * ball.vz * 0.16;
  ball.vy = ball.vy * keep * 0.5 + oy * DEFLECT * 0.8 + Math.tan(aim.ay) * ball.vz * 0.16;
  setCurve(v.x * CURVE_K, v.y * CURVE_K);
  return { ox, oy };
}

// varrimento: a raquete conta em todo o percurso dos últimos 90 ms, não só na posição atual —
// num gesto rápido a bola é apanhada a meio do caminho, como num golpe verdadeiro.
// Devolve a posição da raquete no ponto do percurso que apanhou a bola (ou null).
function sweepHit() {
  const now = performance.now();
  const sm = rigMe.smash > 0;
  const ex = (PW + BR * 0.9) * (sm ? 1.15 : 1), ey = (PH + BR * 0.9) * (sm ? 1.15 : 1);
  let best = null, bd = Infinity;
  const test = (x, y) => {
    const dx = (ball.x - x) / ex, dy = (ball.y - y) / ey, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = { x, y }; }
  };
  const pts = samples.filter(q => now - q.t <= (sm ? 160 : 90));
  if (sm && rigMe.smashPos) test(rigMe.smashPos.x, rigMe.smashPos.y);   // remate: a posição no instante do clique também conta
  pts.push({ x: me.x, y: me.y });
  test(me.x, me.y);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 0.03));
    for (let k = 0; k <= n; k++) test(a.x + (b.x - a.x) * k / n, a.y + (b.y - a.y) * k / n);
  }
  return bd <= 1 ? best : null;
}
// gesto usado no golpe: o atual ou, se tiveres abrandado mesmo antes do contacto, o recente
function strokeGesture() {
  const v = paddleVel();
  return Math.hypot(v.x, v.y) >= Math.hypot(me.gx, me.gy) ? v : { x: me.gx, y: me.gy };
}

function serve() {
  if (G.server === 'op') return;
  if (Math.abs(TD - TD_TARGET) > 0.01 || G.warp) return;   // espera que o túnel acabe de mudar
  // serviço: o primeiro clique lança sempre a bola ao ar; depois bate-se-lhe (clique ou gesto rápido através dela)
  if (!G.toss) { G.toss = { vy: -1.55 }; sfx.whoosh(0.2, 0, 0, 1.4, 0, 0.5, 0.15); return; }
  const hp = sweepHit();
  if (!hp) return;
  const v = strokeGesture();
  const pw = strokePower(v);
  const tossY = ball.y;
  G.toss = null;
  ball.vx = ball.vy = 0;
  ball.z = BR + 0.005;
  // bola lançada e apanhada no alto: pancada de cima para baixo, um pouco mais forte
  const high = clamp(-tossY / 0.35, -1, 1);
  launch(hp.x, hp.y, v, (0.85 + 0.3 * pw) * (1 + 0.12 * Math.max(0, high)), 0);
  // no serviço a bola está parada: o gesto também aponta (permite servir para os cantos)
  ball.vx += clamp(v.x * 0.13, -0.75, 0.75); ball.vy += clamp(v.y * 0.1, -0.5, 0.5);
  // orientação vertical conforme a altura da bola no momento do golpe: alta → para baixo; baixa → para cima
  ball.vy += clamp(-tossY * 1.4, -0.7, 0.7);
  if (TARGET) { const ck = tgCurveK(); ball.cx *= ck; ball.cy *= ck; }   // tiro ao alvo: menos desvio por efeito
  G.mode = 'play'; G.served++; G.lastBlock = pw < 0.15; G.turn = 'op';
  if (TIMED) tmStart('point');                 // cronometrado: a partir do teu serviço
  aiObserve(true);
  G.oppAttack = G.lastBlock && G.level >= 2 && Math.random() < 0.6;
  rigOp.hard = G.oppAttack;
  newAIError();
  const m = Math.hypot(ball.cx, ball.cy);
  sfx.paddle(true, m, 0.4 + pw * 0.6);
  sfx.whoosh(0.3 + pw * 0.9, me.x / TX, 0, 1, Math.sign(v.x) * Math.min(1, Math.abs(v.x) / 4), 1, 0.06); lastSwingWhoosh = performance.now();
  rigMe.vz += 3.5;
  swingRig(rigMe, v.x, v.y, pw, me.x, me.y); addFlash(ball.x, ball.y, 0, PAL.me.glow);
  if (pw > 0.9) ignite(0.45, '120,210,255');
  if (m > 0.6) { const b = Math.round(m * 25) * 4; addScore(b); pop((m > 2.6 ? 'SUPER CURVA +' : 'CURVA +') + b); }
}

// clique durante a jogada: prepara um remate (vale se a bola chegar nos 0,25 s seguintes)
function strike() {
  rigMe.smash = 0.3;
  rigMe.smashPos = { x: me.x, y: me.y };   // o clique marca 'bater aqui'
  const tc = ball.vz < 0 ? ball.z / -ball.vz : Infinity;
  if (tc > 0.4) { swingRig(rigMe, me.gx, me.gy, 0.8, me.x, me.y); sfx.whoosh(0.7, me.x / TX, 0, 0.9); lastSwingWhoosh = performance.now(); }   // golpe no vazio
}

function playerHit(hp) {
  G.turn = 'op';
  const penSave = PENALTY && G.server === 'op';          // defendeste o penálti do adversário
  if (TIMED && TM.kind !== 'point') tmStart('point');    // cronometrado: no serviço dele, conta a partir da tua devolução
  ball.z = Math.abs(ball.z);              // reflexão no plano da raquete
  const v = strokeGesture();
  const pw = strokePower(v);
  const smash = rigMe.smash > 0;
  G.rally++;
  // parada = bloqueio lento; gesto rápido = ataque; clique na altura certa = remate
  let mul = 0.78 + 0.32 * pw;
  if (smash) mul *= 1.28;
  const { ox, oy } = launch(hp.x, hp.y, v, mul, 0.25);
  G.lastBlock = pw < 0.15 && !smash;
  aiObserve(false);
  newAIError();
  sfx.paddle(true, Math.hypot(ball.cx, ball.cy), smash ? 1.5 : 0.35 + pw * 0.75);
  swingRig(rigMe, v.x, v.y, smash ? 1.4 : pw, me.x, me.y); addFlash(ball.x, ball.y, 0, PAL.me.glow);
  rigMe.smash = 0;
  G.oppAttack = G.lastBlock && G.level >= 2 && Math.random() < 0.6;
  rigOp.hard = G.oppAttack;

  if (G.lastBlock) { addScore(50); pop('BLOQUEIO +50', '#b8c4cc'); }
  else addScore(100);
  if (smash) {
    addScore(150); pop('REMATE +150', '#ffd27a');
    ignite(1, '255,190,70'); G.shake = 0.3;
    addFlash(ball.x, ball.y, 0.02, '255,220,120', 2.5, 0.35);  // onda de choque
  } else if (pw > 0.85) ignite(0.45, '120,210,255');            // ataque forte: rasto azul
  else fire.k = 0;
  if (smash || pw > 0.7) matrixArm('me', 0.14);                  // raquetada forte: talvez tempo-bala
  if (Math.abs(ox) < 0.2 && Math.abs(oy) < 0.2) { addScore(200); pop('CENTRO +200', '#7fd4ff'); }
  const m = Math.hypot(ball.cx, ball.cy);
  if (m > 0.6) {
    const b = Math.round(m * 25) * 4;
    addScore(b);
    pop((m > 2.6 ? 'SUPER CURVA +' : 'CURVA +') + b);
  }
  if (penSave) penResult('op', false);
}

// aponta a bola a uma parede (lateral, teto ou chão) para ressaltar até à zona do jogador
function wallAim(tfs) {
  let w = Math.floor(Math.random() * 4);
  if (NET && w === 3) w = 2;   // com rede não ressalta no chão
  const ax = rnd(-0.45, 0.45), ay = rnd(-0.35, 0.35);
  if (w < 2) { const sx2 = w === 0 ? -1 : 1; ball.vx = clamp((2 * LX * sx2 - ax - ball.x) / tfs, -2.4, 2.4); ball.vy = clamp((ay - ball.y) / tfs, -1.2, 1.2); }
  else       { const sy2 = w === 2 ? -1 : 1; ball.vy = clamp((2 * LY * sy2 - ay - ball.y) / tfs, -2.2, 2.2); ball.vx = clamp((ax - ball.x) / tfs, -1.3, 1.3); }
}
function oppHit(weak, isServe) {
  if (!isServe && G.rally === 0 && G.server !== 'op') G.aceRun = 0;   // devolveu o teu serviço: acaba a série de ases
  G.turn = 'me';
  ball.z = 2 * TD - ball.z;
  const L = G.level;
  const ox = clamp((ball.x - op.x) / PW, -1, 1);
  const oy = clamp((ball.y - op.y) / PH, -1, 1);
  // uma bola bloqueada (lenta) convida o adversário a atacar
  let mul = 1;
  if (G.oppAttack && !weak) mul = Math.min(1.12 + 0.02 * L, 1.35);
  if (weak) mul = 0.72;
  ball.vz = -speed() * mul;
  // escolhe um ponto de chegada: às vezes procura o lado oposto à tua raquete (mais vezes nos níveis altos),
  // às vezes joga para uma zona mais central — bolas legíveis, sem exageros
  op.read = false;
  const away = !weak && Math.random() < Math.min(0.1 + 0.045 * L, 0.7);
  const sx = me.x === 0 ? (Math.random() < 0.5 ? -1 : 1) : -Math.sign(me.x);
  const sy = me.y === 0 ? (Math.random() < 0.5 ? -1 : 1) : -Math.sign(me.y);
  const tgx = away ? sx * rnd(0.3, 0.45 + Math.min(L, 8) * 0.03) : rnd(-0.3, 0.3) + me.x * 0.4;
  const tgy = away ? sy * rnd(0.1, 0.4) : rnd(-0.2, 0.2) + me.y * 0.4;
  const tf = TD / Math.abs(ball.vz);
  ball.vx = clamp((tgx - ball.x) / tf + ox * 0.15 + rnd(-0.1, 0.1), -1.3, 1.3);
  ball.vy = clamp((tgy - ball.y) / tf + oy * 0.12 + rnd(-0.1, 0.1), -1.1, 1.1);
  // efeito do adversário: cresce devagar com o nível e tem limite
  const cm = weak ? 0 : Math.min(0.09 * (L - 1), 1.8) * Math.sqrt(Math.random());
  const ang = Math.random() * Math.PI * 2;
  setCurve(Math.cos(ang) * cm + op.vx * CURVE_K * 0.4, Math.sin(ang) * cm + op.vy * CURVE_K * 0.4);
  // durante a jogada também joga contra as paredes (mais vezes nos níveis altos)
  if (!weak && !isServe && Math.random() < Math.min(0.12 + 0.025 * L, 0.35)) {
    wallAim(TD / Math.abs(ball.vz));
    setCurve(ball.cx * 0.4, ball.cy * 0.4);
  }
  if (isServe) {
    // serviço do adversário: varia o tipo — plano, a descer, a subir, ao canto ou com efeito lateral
    const styles = PENALTY ? ['canto', 'canto', 'canto', 'efeito', 'parede', 'desce', 'sobe']   // penáltis: remates colocados
                           : ['plano', 'desce', 'sobe', 'canto', 'efeito', 'parede', 'parede'];
    const stl = styles[Math.floor(Math.random() * styles.length)];
    const sd = Math.random() < 0.5 ? -1 : 1, sv = Math.random() < 0.5 ? -1 : 1;
    const ce = Math.min(0.5 + 0.08 * (L - 1), 1.8) * (PENALTY ? 1.3 : 1);   // efeito máximo (cresce com o nível)
    let tx = rnd(-0.35, 0.35), ty = rnd(-0.2, 0.2), cx = 0, cy = 0, sm = rnd(0.92, 1.08);
    if (stl === 'desce')  { ty = rnd(0.3, 0.5);   cy = ce * rnd(0.3, 0.7); }        // bate no alto e cai a pique
    if (stl === 'sobe')   { ty = rnd(-0.5, -0.3); cy = -ce * rnd(0.2, 0.5); }       // sai baixo e sobe
    if (stl === 'canto')  { tx = sd * rnd(0.45, 0.65); ty = sv * rnd(0.25, 0.45); sm *= 1.05; }
    if (PENALTY) {                                               // penálti: mais longe do centro e mais forte
      if (stl === 'canto') { tx = sd * rnd(0.6, 0.85); ty = sv * rnd(0.35, 0.6); }
      else if (stl !== 'efeito') tx = sd * rnd(0.35, 0.7);
      sm *= rnd(1.05, 1.15);
    }
    if (stl === 'efeito') { tx = -sd * rnd(0.1, 0.35); cx = sd * ce * rnd(0.6, 1); cy = rnd(-0.3, 0.3); }   // curva para o lado
    // penáltis: o remate do adversário é sempre forte (no mínimo ~nível 7) mas não passa de ~nível 13 (defender tem de ser possível)
    const tdk = Math.pow(TD / TD_BASE, TUN.speedExp);
    ball.vz = -(PENALTY ? clamp(speed(), TUN.penShotMin * tdk, TUN.penShotCap * (1 + 0.01 * OVR(G.level)) * tdk) : speed()) * sm;
    const tfs = TD / Math.abs(ball.vz);
    // aponta descontando a deriva do efeito (a bola chega perto do alvo, mas a curva vê-se)
    ball.vx = clamp((tx - ball.x) / tfs - 0.5 * cx * tfs * 0.6, -1.3, 1.3);
    ball.vy = clamp((ty - ball.y) / tfs - 0.5 * cy * tfs * 0.6, -1.2, 1.2);
    if (stl === 'parede') { wallAim(tfs); cx = 0; cy = 0; }   // ressalto numa parede antes de chegar a ti
    setCurve(cx, cy);
  }
  // com rede: garante que a bola passa por cima (ajusta a altura do arco)
  if (NET && G.forceNet) {
    // serviço falhado: sai baixo e bate na rede
    const tm = Math.max(0.05, (ball.z - TD / 2) / Math.abs(ball.vz));
    ball.cy = 0; ball.cx *= 0.3;
    ball.vy = clamp((NET.top + rnd(0.08, 0.22) - ball.y) / tm, -2.2, 2.2);
  } else if (NET) {
    const tm = Math.max(0.05, (ball.z - TD / 2) / Math.abs(ball.vz));
    const yMid = ball.y + ball.vy * tm + 0.5 * ball.cy * tm * tm;
    if (yMid > NET.top - BR - 0.06) {
      const want = NET.top - 0.14 - rnd(0, 0.22);
      ball.vy = clamp((want - ball.y - 0.5 * ball.cy * tm * tm) / tm, -2.2, 2.2);
    }
  }
  // decide já a força do próximo golpe para a animação de preparação
  sfx.paddle(false, Math.hypot(ball.cx, ball.cy), mul > 1 ? 1.4 : 0.8);
  swingRig(rigOp, op.vx, op.vy, mul > 1 ? 1.4 : 0.6, op.x, op.y);
  addFlash(ball.x, ball.y, TD, PAL.op.glow);
  if (mul > 1) { ignite(0.75, '255,80,60'); addFlash(ball.x, ball.y, TD, '255,120,90', 3, 0.35); if (L >= 3) matrixArm('op', 0.1); }
  else fire.k = 0;
}

// falha no serviço (bola falhada ou à rede): a 1.ª repete-se; à 2.ª seguida o serviço passa para o outro
function serveFault() {
  if (PENALTY) { penResult(G.server, false); return; }   // penálti falhado (sem segunda oportunidade)
  G.faults = (G.faults || 0) + 1;
  if (G.server !== 'op') G.aceRun = 0;
  G.mode = 'miss'; G.timer = 0.9; G.after = 'fault';
}
// --- Bumerangue (raro e inesperado): numa bola que o adversário falha, a bola segue até ao "infinito",
// faz a curva e volta em arco para ti; o jogo continua. Se voltares a ganhar o ponto, vale pontos extra.
function tryBoomerang() {
  if (G.boomUsed || G.warp || PENALTY || TARGET || Math.random() > 0.085) return false;
  G.boomUsed = true; G.boomBonus = true;
  const sp = Math.max(ball.vz, speed());
  G.boom = { t: 0, z0: ball.z, x0: ball.x, y0: ball.y, ex: rnd(-0.5, 0.5), ey: rnd(-0.35, 0.3),
             far: TD + rnd(4.5, 6), sp, dir: Math.random() < 0.5 ? -1 : 1, T1: 1.0, T2: 1.1 };
  G.mode = 'boom';
  sfx.boomerang(G.boom.T1 + G.boom.T2);
  return true;
}
function updateBoomerang(dt) {
  const b = G.boom; if (!b) return;
  b.t += dt;
  const T1 = b.T1, T2 = b.T2;
  if (b.t < T1) {
    // vai até ao infinito, a desviar-se num arco largo
    const u = b.t / T1, e = 1 - (1 - u) * (1 - u);
    ball.z = b.z0 + (b.far - b.z0) * e;
    ball.x = b.x0 + b.dir * 0.9 * Math.sin(u * Math.PI * 0.5);
    ball.y = b.y0 - 0.25 * Math.sin(u * Math.PI);
  } else {
    // regressa em arco (como um bumerangue) e reentra no túnel em direção a ti
    const u = Math.min(1, (b.t - T1) / T2), e = u * u;
    const zIn = TD - 0.02;
    ball.z = b.far + (zIn - b.far) * e;
    const xs = b.x0 + b.dir * 0.9, xm = -b.dir * 1.1;
    ball.x = xs + (xm - xs) * Math.sin(u * Math.PI * 0.5) * (1 - u) + (b.ex - xs) * u * u;
    ball.y = (b.y0 - 0.0) * (1 - u) + b.ey * u + 0.2 * Math.sin(u * Math.PI);
    if (u >= 1) {
      // de volta ao jogo: vem para ti com o giro do bumerangue
      G.boom = null; G.mode = 'play';
      ball.z = zIn; ball.vz = -b.sp * 1.05;
      const tf = TD / Math.abs(ball.vz);
      ball.vx = clamp(rnd(-0.4, 0.4) / tf, -1, 1); ball.vy = clamp(rnd(-0.25, 0.25) / tf, -0.8, 0.8);
      setCurve(-b.dir * rnd(0.8, 1.6), rnd(-0.4, 0.4));
      op.react = 0.3;
    }
  }
  ball.rot += 18 * dt;   // gira depressa
}
function squashOppHit(isServe) {
  G.turn = 'me';
  const L = G.level;
  ball.z = SQZ + 0.01;
  ball.vz = speed() * rnd(0.95, 1.1);
  const ttot = ((TD - ball.z) + TD) / ball.vz;          // até à parede e de volta ao teu plano
  const away = Math.random() < Math.min(0.15 + 0.045 * L, 0.7);
  const sx = me.x === 0 ? (Math.random() < 0.5 ? -1 : 1) : -Math.sign(me.x);
  const tx = away ? sx * rnd(0.3, 0.65) : rnd(-0.35, 0.35);
  const ty = rnd(-0.35, 0.4);
  ball.vx = clamp((tx - ball.x) / ttot, -1.3, 1.3);
  ball.vy = clamp((ty - ball.y) / ttot, -1.1, 1.1);
  const cm = Math.min(0.08 * (L - 1), 1.3) * Math.sqrt(Math.random()), ang = Math.random() * Math.PI * 2;
  setCurve(Math.cos(ang) * cm, Math.sin(ang) * cm);
  if (!isServe && Math.random() < Math.min(0.12 + 0.025 * L, 0.35)) wallAim(ttot);
  fire.k = 0;
  sfx.paddle(false, Math.hypot(ball.cx, ball.cy), 0.9);
  swingRig(rigOp, op.vx, op.vy, 0.7, op.x, op.y);
  addFlash(ball.x, ball.y, SQZ, PAL.op.glow);
}
function missMe() {
  if (PENALTY) { penResult('op', true); return; }        // golo do adversário: não defendeste
  const dbl = G.boomBonus; G.boomBonus = false;   // ponto do bumerangue vale a dobrar (também para o adversário)
  G.mode = 'miss'; G.timer = 1.25;
  G.nextServer = 'op';          // perdeste o ponto: serve o adversário
  sfx.lose();
  // contagem do ténis: 4 pontos com 2 de vantagem (com iguais/vantagem)
  G.po = (G.po || 0) + (dbl ? 2 : 1);
  if (G.po >= 4 && G.po - (G.pm || 0) >= 2) {
    G.lives--;                  // perdeste o jogo (nível): perdes uma bola e repetes o nível
    G.levelLosses = (G.levelLosses || 0) + 1;
    G.after = (G.lives <= 0 || G.levelLosses >= 3) ? 'gameover' : 'regame';   // 3 jogos perdidos no mesmo nível: fim
  } else G.after = 'serve';
}
function missOpp() {
  if (PENALTY) { penResult('me', true); return; }        // golo teu: o adversário não defendeu o serviço
  G.mode = 'miss'; G.timer = 1.25;
  G.pm = (G.pm || 0) + (G.boomBonus ? 2 : 1);   // ponto do bumerangue vale a dobrar
  G.nextServer = 'me';          // ganhaste o ponto: serves tu
  const fast = Math.max(250, 2000 - Math.max(0, G.rally - 1) * 175);
  if (G.boomBonus) { G.boomBonus = false; addScore(3000 * G.level); sfx.extra(); }   // ganhaste outra vez depois do bumerangue
  addScore(fast);
  sfx.win();
  // serviço direto (ás): o adversário não devolveu o teu serviço.
  // A cada 3 ases — seguidos ou intercalados com outros pontos — ganhas uma bola extra.
  const ace = G.rally === 0 && G.server !== 'op';
  let extra = false;
  if (ace) {
    G.aces = (G.aces || 0) + 1;
    G.aceRun = (G.aceRun || 0) + 1;     // ases seguidos: o adversário fica cada vez mais atento
    const k = G.aces % 3 === 0 ? 3 : G.aces % 3;
    if (k === 3 && G.lives < MAX_LIVES) { G.lives++; extra = true; pop('3 ASES · +1 BOLA', '#7fd4ff'); sfx.extra(); }
    else pop('SERVIÇO DIRETO ' + k + '/3', '#7fd4ff');
  }
  const head = ace ? 'ÁS!' : 'PONTO!';
  if (G.pm >= 4 && G.pm - (G.po || 0) >= 2) {   // ganhaste o jogo (nível)
    const lb = 1000 * G.level;
    addScore(lb);
    G.after = 'level';

  } else {
    G.after = 'serve';

  }

// --- Física da bola -------------------------------------------------------
