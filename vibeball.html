  ctx.lineWidth = 1;
}

function drawDepthRing() {
  if (!ball.visible || ball.z < 0 || ball.z > TD) return;
  if (ROUND) {                       // túnel redondo: anel circular à profundidade da bola
    const c = P(0, 0, ball.z);
    ctx.save(); ctx.strokeStyle = `hsla(${Math.round(ballHue)},100%,62%,0.95)`; ctx.shadowColor = `hsla(${Math.round(ballHue)},100%,55%,0.9)`;
    ctx.shadowBlur = 8; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(c.x, c.y, RT * c.s * K, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    return;
  }
  const r = rectAt(ball.z);
  ctx.save();
  ctx.strokeStyle = `hsla(${Math.round(ballHue)},100%,62%,0.95)`;
  ctx.shadowColor = `hsla(${Math.round(ballHue)},100%,55%,0.9)`;
  ctx.shadowBlur = 8;
  ctx.lineWidth = 2;
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  ctx.restore();
}

// =========================================================================
//  RAQUETES 3D ANIMADAS
//  A orientação de cada raquete é uma mola amortecida (roll / yaw / pitch / avanço)
//  que persegue um alvo calculado a partir de:
//   · lado do ecrã → direita (forehand) ou esquerda (backhand), com viragem da raquete
//   · posição → o braço "pivota" a partir do centro, inclinando a raquete nas zonas extremas
//   · velocidade do gesto → a face inclina-se no sentido do movimento (escovadela)
//   · bola a chegar → preparação (recua, abre a face) e batida para a frente
//   · impacto → follow-through a cruzar o corpo e no sentido do gesto
// =========================================================================
const HEAD_N = 40, BLADE = 0.018, HANDLE_L = 0.17, HANDLE_W = 0.034;
const PAL = {
  me: { front: '60,140,255', back: '20,55,150', glow: '90,170,255', alpha: 0.30 },
  op: { front: '255,70,70',  back: '150,25,30', glow: '255,90,90',  alpha: 0.45 }
};
function makeRig(mirror) {
  return { mirror, side: 1, roll: mirror ? -0.5 : 0.5, yaw: 0, pitch: 0, z: 0,
           vr: 0, vyaw: 0, vp: 0, vz: 0, ox: 0, oy: 0, vox: 0, voy: 0, hist: [], speed: 0 };
}
const rigMe = makeRig(false), rigOp = makeRig(true);
const flashes = [];

function spring(r, key, vkey, target, dt, k, c) {
  r[vkey] += (k * (target - r[key]) - c * r[vkey]) * dt;
  r[key] += r[vkey] * dt;
}
// ângulo da face (radianos): o gesto inclina-a no sentido do movimento e,
// nas zonas extremas, o braço vira-a para o centro da mesa
function faceAim(x, y, vx, vy) {
  return {
    ax: clamp(clamp(vx, -9, 9) * 0.17, -0.95, 0.95) - x * 0.22,
    ay: clamp(clamp(vy, -9, 9) * 0.16, -0.85, 0.85) - y * 0.25
  };
}
// =========================================================================
//  GOLPES ANIMADOS
//  Quando a bola se aproxima, a raquete escolhe o golpe conforme a SUA posição:
//    em cima → SMASH (de cima para baixo) · em baixo → LIFT (de baixo para cima)
//    à direita → DIREITA (varre para a esquerda) · à esquerda → ESQUERDA (varre para a direita)
//  (um gesto vertical forte também pode impor o smash ou o lift)
//  Fases: preparação (recua até à pose W) → batida a acelerar (passa pela posição real
//  EXATAMENTE no contacto) → acompanhamento (pose F) → regresso.
//  O golpe é só visual: a física usa sempre a posição controlada.
// =========================================================================
const STROKES = {
  //          pose de preparação W                                      pose final F                                              arco
  fore:  { W: { ox: 0.24, oy: 0.06, z: -0.15, yaw: 0.95, pitch: 0, roll: -0.55 },
           F: { ox: -0.32, oy: -0.22, z: 0.32, yaw: -1.05, pitch: 0, roll: 0.95 }, bulge: [0, 0.12] },
  back:  { W: { ox: -0.24, oy: 0.06, z: -0.15, yaw: -0.95, pitch: 0, roll: -0.55 },
           F: { ox: 0.32, oy: -0.22, z: 0.32, yaw: 1.05, pitch: 0, roll: 0.95 }, bulge: [0, 0.12] },
  smash: { W: { ox: 0.08, oy: -0.28, z: -0.13, yaw: 0, pitch: 0.95, roll: -0.25 },
           F: { ox: -0.06, oy: 0.34, z: 0.36, yaw: 0, pitch: -1.0, roll: 0.35 }, bulge: [0.14, 0] },
  lift:  { W: { ox: 0.06, oy: 0.26, z: -0.12, yaw: 0, pitch: -0.5, roll: -0.2 },
           F: { ox: -0.05, oy: -0.32, z: 0.28, yaw: 0, pitch: 0.75, roll: 0.3 }, bulge: [0.14, 0] }
};
const T_START = 0.42, T_FWD = 0.17, T_FOLLOW = 0.2, T_RET = 0.35;
const easeIO = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;

// golpe ditado pelo gesto (se for rápido o suficiente)
function gestureStroke(r, vx, vy) {
  const m = Math.hypot(vx, vy);
  if (m < 3) return null;
  if (Math.abs(vy) > Math.abs(vx) * 0.8) return vy > 0 ? 'smash' : 'lift';
  const gx = r.mirror ? -vx : vx;
  return gx < 0 ? 'fore' : 'back';     // para a esquerda = direita (varre para a esquerda) · para a direita = esquerda
}
function chooseStroke(r, x, y, vx, vy) {
  const px = r.mirror ? -x : x;
  let type = gestureStroke(r, vx, vy);
  if (type) {}
  else if (y < -0.2) type = 'smash'; else if (y > 0.22) type = 'lift';
  else type = px >= 0 ? 'fore' : 'back';
  const sx = px >= 0 ? 1 : -1;
  // face que se vê: direita = face da frente, esquerda = face de trás
  r.side = type === 'fore' ? 1 : type === 'back' ? -1 : sx;
  r.st = { type, sx, sg: r.side, phase: 'wind', w: 0, s: -1, t: 0,
           big: (r.smash > 0 || r.hard) ? 1.3 : 1, pf: 1 };
}
// deslocamento da pose em relação à raquete "de base" (posição real + orientação do gesto)
function strokeDelta(r) {
  const st = r.st;
  if (!st) return null;
  const S = STROKES[st.type], mf = r.mirror ? -1 : 1;
  const sxm = (st.type === 'smash' || st.type === 'lift') ? st.sx : 1;
  const pose = (P0, k) => ({
    ox: P0.ox * sxm * mf * k, oy: P0.oy * k, z: P0.z * k,
    yaw: P0.yaw * mf * k, pitch: P0.pitch * st.sg * mf * k, roll: -P0.roll * mf * k
  });
  const W = pose(S.W, st.big), F = pose(S.F, st.big * st.pf);
  let d;
  if (st.s <= 0) { const u = st.s + 1, e = u * u;           // batida: acelera até ao contacto
    d = {}; for (const k in W) d[k] = W[k] * (1 - e);
  } else { const u = st.s, e = 1 - (1 - u) * (1 - u);       // acompanhamento: desacelera
    d = {}; for (const k in F) d[k] = F[k] * e;
  }
  const bw = Math.sin(Math.PI * (st.s + 1) / 2) * st.big;   // arco: a trajetória curva
  d.ox += S.bulge[0] * sxm * mf * bw; d.oy += S.bulge[1] * bw;
  for (const k in d) d[k] *= st.w;
  return d;
}
function stepStroke(r, x, y, vx, vy, dt, tc) {
  const st = r.st;
  if (!st) {
    if (tc < T_START && tc > 0.05) chooseStroke(r, x, y, vx, vy);
    return;
  }
  if (st.phase === 'wind') {
    st.w = Math.min(1, st.w + dt / 0.16); st.s = -1;
    if (tc <= T_FWD) st.phase = 'fwd';
    else if (!(tc < T_START + 0.2)) { st.phase = 'ret'; st.t = 0; }   // a bola já não vem
  }
  if (st.phase === 'fwd') {
    st.w = Math.min(1, st.w + dt / 0.08);
    if (isFinite(tc) && tc > 0) st.s = -Math.min(1, tc / T_FWD);
    else { st.phase = 'follow'; st.t = 0; }                           // contacto (ou falhou)
  }
  if (st.phase === 'follow') {
    st.t += dt; st.s = Math.min(1, st.t / T_FOLLOW);
    if (st.t >= T_FOLLOW) { st.phase = 'ret'; st.t = 0; }
  }
  if (st.phase === 'ret') {
    st.t += dt; st.s = 1; st.w = Math.min(st.w, 1 - easeIO(Math.min(1, st.t / T_RET)));
    if (st.t >= T_RET) r.st = null;
  }
}

// tc = tempo até a bola chegar a esta raquete (Infinity se não vier)
function updateRig(r, x, y, vx, vy, dt, tc) {
  if (dt <= 0) return;
  r.lock = Math.max(0, (r.lock || 0) - dt);
  r.smash = Math.max(0, (r.smash || 0) - dt);
  stepStroke(r, x, y, vx, vy, dt, tc);
  if (!r.st) {
    // sem golpe em curso: o lado acompanha a posição (com histerese)
    const sx = r.mirror ? -x : x;
    if (r.lock === 0 && Math.hypot(vx, vy) < 2.2) {
      if (r.side > 0 && sx < -0.18) r.side = -1;
      else if (r.side < 0 && sx > 0.18) r.side = 1;
    }
  }
  const fore = r.side > 0, sg = fore ? 1 : -1;
  const aim = faceAim(x, y, vx, vy);
  if (!r.mirror && input.touch) aim.ay += y * 0.25;   // tátil: sem inclinação pela altura (a ponta da pega fica sob o dedo)
  const yawT   = (fore ? 0 : Math.PI) + aim.ax;
  const pitchT = -sg * aim.ay;
  // no ecrã tátil a pega aponta a direito para baixo: a ponta fica sempre sob o dedo
  // a pega aponta sempre para o centro (o "corpo") e a cabeça para fora:
  //  · em cima: pega para baixo · em baixo: pega quase deitada para o centro (sem rodar por completo)
  //  · no ecrã tátil (a tua raquete) a pega fica sempre a direito para baixo, para o dedo ficar na ponta
  const fb = clamp((y - 0.12) / 0.4, 0, 1), fbs = fb * fb * (3 - 2 * fb);          // transição suave na parte de baixo
  // em baixo a raquete baixa e a pega deita-se para o centro (até ~70°), sem dar a volta — como um braço real
  const mag = 0.5 * (1 - y * 0.35) * (1 - fbs) + 1.2 * fbs;
  const rollT  = (!r.mirror && input.touch) ? 0 : (r.mirror ? -1 : 1) * mag + sg * clamp(clamp(vx, -9, 9) * 0.05, -0.35, 0.35);
  const n = Math.max(1, Math.ceil(dt / 0.004)), h = dt / n;
  for (let i = 0; i < n; i++) {
    spring(r, 'yaw', 'vyaw', yawT, h, 190, 20);
    spring(r, 'pitch', 'vp', pitchT, h, 190, 20);
    spring(r, 'roll', 'vr', rollT, h, 150, 18);
    spring(r, 'z', 'vz', 0, h, 260, 22);
  }
  r.speed += (Math.hypot(vx, vy) - r.speed) * Math.min(1, dt * 20);
}
// contacto: passa ao acompanhamento, com amplitude conforme a força da pancada
function swingRig(r, vx, vy, power, x, y) {
  r.lock = 0.4; r.hard = false;
  if (!r.st) {   // serviço ou golpe sem preparação: escolhe já o golpe e faz só o acompanhamento
    chooseStroke(r, x !== undefined ? x : 0, y !== undefined ? y : 0, vx, vy);
    r.st.w = 1;
  }
  // no contacto, o acompanhamento segue o gesto que fizeste de facto
  const gt = gestureStroke(r, vx, vy);
  if (gt) { r.st.type = gt; r.st.sx = (r.mirror ? -vx : vx) >= 0 ? 1 : -1; }
  r.st.phase = 'follow'; r.st.t = 0; r.st.s = 0; r.st.w = 1;
  r.st.pf = 0.85 + 0.55 * clamp(power, 0, 1.5);
}
function addFlash(x, y, z, rgb, size = 1, life = 0.22) { flashes.push({ x, y, z, rgb, t: 0, size, life }); }

// orientação: roll (rotação no plano da face) → pitch → yaw
function rot(st, u, v, w) {
  let c = Math.cos(st.roll), s = Math.sin(st.roll);
  const x1 = u * c - v * s, y1 = u * s + v * c, z1 = w;
  c = Math.cos(st.pitch); s = Math.sin(st.pitch);
  const y2 = y1 * c - z1 * s, z2 = y1 * s + z1 * c, x2 = x1;
  c = Math.cos(st.yaw); s = Math.sin(st.yaw);
  return { x: x2 * c + z2 * s, y: y2, z: -x2 * s + z2 * c };
}
function WP(st, u, v, w) {
  const r = rot(st, u, v, w);
  return P(st.x + r.x, st.y + r.y, st.z + r.z);
}
function pathPts(pts) {
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
}

function drawRacket(st, pal, am, ghost) {
  const camZ = -CAM;
  const toCam = (wx, wy, wz) => ({ x: wx, y: wy, z: wz - camZ });
  const nF = rot(st, 0, 0, -1);
  const d0 = toCam(st.x, st.y, st.z);
  const frontVisible = nF.x * d0.x + nF.y * d0.y + nF.z * d0.z < 0;
  const wNear = frontVisible ? -BLADE / 2 : BLADE / 2;
  const wFar = -wNear;
  const facing = Math.abs(nF.x * d0.x + nF.y * d0.y + nF.z * d0.z) / Math.hypot(d0.x, d0.y, d0.z);
  const rgb = frontVisible ? pal.front : pal.back;
  const unit = P(st.x, st.y, st.z).s * K;

  ctx.save();
  ctx.lineJoin = 'round';

  // pega futurista: corpo em grafite, linha de energia néon, anéis de grip e ponta luminosa
  const hw = HANDLE_W, h0 = PH * 0.9, hEnd = PH + (pal === PAL.me && input.touch ? HANDLE_L_TOUCH : HANDLE_L);
  const handle = [
    [-hw * 0.55, h0], [hw * 0.55, h0], [hw * 0.8, PH + 0.03], [hw, PH + 0.06],
    [hw * 1.05, hEnd - 0.03], [hw * 1.3, hEnd - 0.01], [hw * 1.2, hEnd + 0.012], [-hw * 1.2, hEnd + 0.012],
    [-hw * 1.3, hEnd - 0.01], [-hw * 1.05, hEnd - 0.03], [-hw, PH + 0.06], [-hw * 0.8, PH + 0.03]
  ].map(([u, v]) => WP(st, u, v, 0));
  const glowA = (ghost ? 0.6 : 1) * am;
  if (!ghost) {
    // corpo: grafite com reflexo metálico lateral
    const L = WP(st, -hw * 1.1, (h0 + hEnd) / 2, 0), R = WP(st, hw * 1.1, (h0 + hEnd) / 2, 0);
    const g = ctx.createLinearGradient(L.x, L.y, R.x, R.y);
    g.addColorStop(0, `rgba(14,18,26,${am})`);
    g.addColorStop(0.3, `rgba(70,84,104,${am})`);
    g.addColorStop(0.45, `rgba(150,165,185,${am})`);
    g.addColorStop(0.6, `rgba(48,58,74,${am})`);
    g.addColorStop(1, `rgba(10,13,20,${am})`);
    ctx.fillStyle = g;
    pathPts(handle); ctx.fill();
  }
  ctx.strokeStyle = `rgba(${pal.glow},${0.55 * glowA})`;
  ctx.lineWidth = Math.max(1, unit * 0.004);
  pathPts(handle); ctx.stroke();
  if (!ghost) {
    ctx.save();
    ctx.shadowColor = `rgba(${pal.glow},0.95)`; ctx.shadowBlur = 8;
    // linha de energia ao longo da pega
    let a = WP(st, 0, PH + 0.035, -0.001), b = WP(st, 0, hEnd - 0.025, -0.001);
    ctx.strokeStyle = `rgba(${pal.glow},${0.95 * am})`;
    ctx.lineWidth = Math.max(1.2, unit * 0.007);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    // anéis de grip
    ctx.lineWidth = Math.max(1, unit * 0.005);
    ctx.strokeStyle = `rgba(${pal.glow},${0.6 * am})`;
    ctx.beginPath();
    for (let k = 0; k < 4; k++) {
      const v = PH + 0.07 + k * 0.025, ww = hw * (1 + k * 0.02);
      a = WP(st, -ww, v, 0); b = WP(st, ww, v, 0);
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    }
    ctx.stroke();
    // anel de ligação à cabeça
    ctx.lineWidth = Math.max(1.4, unit * 0.008);
    ctx.strokeStyle = `rgba(230,245,255,${0.85 * am})`;
    a = WP(st, -hw * 0.85, PH + 0.03, 0); b = WP(st, hw * 0.85, PH + 0.03, 0);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    // ponta: núcleo de energia que pulsa
    const c = WP(st, 0, hEnd + 0.002, 0);
    const pr = Math.max(2, unit * 0.022) * (1 + 0.15 * Math.sin(performance.now() / 180));
    const gg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, pr * 2.2);
    gg.addColorStop(0, `rgba(255,255,255,${am})`);
    gg.addColorStop(0.35, `rgba(${pal.glow},${0.9 * am})`);
    gg.addColorStop(1, `rgba(${pal.glow},0)`);
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(c.x, c.y, pr * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // contorno da cabeça (oval) nas duas faces
  const near = [], far = [];
  for (let i = 0; i < HEAD_N; i++) {
    const th = i / HEAD_N * Math.PI * 2, u = Math.cos(th) * PW, v = Math.sin(th) * PH;
    near.push(WP(st, u, v, wNear));
    far.push(WP(st, u, v, wFar));
  }

  // espessura do aro (metal escuro): só as faces laterais viradas para a câmara
  if (!ghost) {
    ctx.fillStyle = `rgba(38,48,64,${0.95 * am})`;
    for (let i = 0; i < HEAD_N; i++) {
      const j = (i + 1) % HEAD_N, th = (i + 0.5) / HEAD_N * Math.PI * 2;
      const nl = rot(st, Math.cos(th) / PW, Math.sin(th) / PH, 0);
      const pr = rot(st, Math.cos(th) * PW, Math.sin(th) * PH, 0);
      const dc = toCam(st.x + pr.x, st.y + pr.y, st.z + pr.z);
      if (nl.x * dc.x + nl.y * dc.y + nl.z * dc.z >= 0) continue;
      ctx.beginPath();
      ctx.moveTo(near[i].x, near[i].y); ctx.lineTo(near[j].x, near[j].y);
      ctx.lineTo(far[j].x, far[j].y); ctx.lineTo(far[i].x, far[i].y);
      ctx.closePath(); ctx.fill();
    }
  }

  // borracha (translúcida para se ver a bola) com brilho conforme o ângulo
  const shade = 0.55 + 0.45 * facing;
  if (!ghost) {
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    for (const p of near) { if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x; if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; }
    const g = ctx.createLinearGradient(minX, minY, maxX, maxY);
    g.addColorStop(0, `rgba(${rgb},${(pal.alpha + 0.12) * shade * am})`);
    g.addColorStop(1, `rgba(${rgb},${(pal.alpha - 0.08) * shade * am})`);
    ctx.fillStyle = g;
    pathPts(near); ctx.fill();
  }
  ctx.shadowColor = `rgba(${pal.glow},0.8)`;
  ctx.shadowBlur = ghost ? 0 : (pal === PAL.me ? 10 : 5);
  ctx.strokeStyle = ghost ? `rgba(${pal.glow},${am})` : `rgba(${rgb},${0.95 * am})`;
  ctx.lineWidth = Math.max(1.4, unit * (ghost ? 0.006 : 0.012));
  pathPts(near); ctx.stroke();
  ctx.shadowBlur = 0;

  if (!ghost) {
    // aro interior metálico (fino) com reflexo
    ctx.strokeStyle = `rgba(200,220,240,${0.45 * am})`;
    ctx.lineWidth = Math.max(1, unit * 0.004);
    pathPts(near); ctx.stroke();
    // linhas de mira e zona central (acompanham a inclinação da face)
    ctx.strokeStyle = `rgba(255,255,255,${0.22 * am})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    let a = WP(st, -PW, 0, wNear), b = WP(st, PW, 0, wNear);
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    a = WP(st, 0, -PH, wNear); b = WP(st, 0, PH, wNear);
    ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.stroke();
    const spot = [];
    for (let i = 0; i < 20; i++) { const th = i / 20 * Math.PI * 2; spot.push(WP(st, Math.cos(th) * PW * 0.2, Math.sin(th) * PH * 0.2, wNear)); }
    ctx.strokeStyle = `rgba(255,255,255,${0.35 * am})`;
    pathPts(spot); ctx.stroke();
  }
  ctx.restore();
}

function drawRacketRig(r, x, y, z, pal, clipZ) {
  const d = strokeDelta(r) || { ox: 0, oy: 0, z: 0, yaw: 0, pitch: 0, roll: 0 };
  const zs = r.mirror ? -1 : 1;    // o adversário avança para o lado contrário
  // o golpe pode levar a raquete às margens, mas não para fora do ecrã
  const st = { x: clamp(x + d.ox, -0.86, 0.86), y: clamp(y + d.oy, -0.64, 0.64), z: z + d.z * zs,
               roll: r.roll + d.roll, yaw: r.yaw + d.yaw, pitch: r.pitch + d.pitch };
  r.hist.push(st);
  if (r.hist.length > 10) r.hist.shift();
  ctx.save();
  if (clipZ !== undefined) { const cr = rectAt(clipZ); ctx.beginPath(); ctx.rect(cr.x, cr.y, cr.w, cr.h); ctx.clip(); }
  // rasto de movimento quando o gesto é rápido
  const sp = clamp((r.speed - 1.2) / 5, 0, 1);
  if (sp > 0) {
    for (const [k, a] of [[6, 0.15], [4, 0.25], [2, 0.4]]) {
      const h = r.hist[r.hist.length - 1 - k];
      if (h) drawRacket(h, pal, a * sp, true);
    }
  }
  drawRacket(st, pal, 1, false);
  ctx.restore();
}

function drawFlashes(dt) {
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    const t = f.t / (f.life || 0.22);
    if (t >= 1) { flashes.splice(i, 1); continue; }
    const p = P(f.x, f.y, f.z), r = (BR + t * 0.13 * (f.size || 1)) * p.s * K;
    ctx.save();
    ctx.strokeStyle = `rgba(${f.rgb},${(1 - t) * 0.9})`;
    ctx.shadowColor = `rgba(${f.rgb},0.9)`; ctx.shadowBlur = 10;
    ctx.lineWidth = Math.max(1, 3 * (f.size || 1) * (1 - t));
    ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * 0.92, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// --- Quebras de luz ocasionais (curto-circuito) ---------------------------------
const glitch = { on: false, t: 0, segs: [], dur: 0, timer: 25, sparks: [], ex: 0, ey: 0, lastDark: 0 };
function startGlitch() {
  // quebra mais intensa e intermitente: muitos apagões curtos (quase negro) com regressos breves de luz
  const segs = [];
  const n = 7 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) {
    const long = i === n - 3 || i === Math.floor(n / 3);
    segs.push({ d: long ? rnd(0.22, 0.4) : rnd(0.03, 0.1), dark: rnd(0.82, 0.97) });
    segs.push({ d: rnd(0.02, 0.07), dark: Math.random() < 0.5 ? rnd(0, 0.12) : rnd(0.35, 0.55) });   // luz a tremer
  }
  glitch.segs = segs; glitch.dur = segs.reduce((a, s2) => a + s2.d, 0);
  glitch.on = true; glitch.t = 0;
  // ponto da avaria: um sítio ao acaso na moldura do túnel
  const side = Math.floor(Math.random() * 4), u = rnd(-0.8, 0.8);
  glitch.ex = side === 0 ? -TX : side === 1 ? TX : u * TX;
  glitch.ey = side === 2 ? -TY : side === 3 ? TY : u * TY;
  glitch.ez = rnd(0, TD * 0.25);
  sfx.shortCircuit(segs);
}
function glitchDark() {
  if (!glitch.on) return 0;
  let t = glitch.t;
  for (const sg of glitch.segs) { if (t < sg.d) return sg.dark; t -= sg.d; }
  return 0;
}
function updateGlitch(dt) {
  if (!glitch.on) {
    if ((G.mode !== 'play' && G.mode !== 'serve') || visIdx !== 0 || DISCO || ROUND) return;   // só em túneis com má visibilidade (nunca na discoteca)
    glitch.timer -= dt;
    // só quando é justo: bola a afastar-se de ti (ainda longe do adversário) ou durante o serviço
    if (glitch.timer <= 0 && !G.warp) startGlitch();          // pode acontecer a qualquer momento
  } else {
    glitch.t += dt;
    if (glitch.t >= glitch.dur) { glitch.on = false; glitch.timer = rnd(30, 70); }
  }
  // faíscas: rebentam sempre que a luz falha
  const d = glitchDark();
  if (glitch.on && d > 0.3 && glitch.lastDark <= 0.3) {
    for (let i = 0; i < 34; i++) glitch.sparks.push({ x: glitch.ex, y: glitch.ey, z: glitch.ez,
      vx: rnd(-1.2, 1.2) - glitch.ex * 0.6, vy: rnd(-1.4, 0.4) - glitch.ey * 0.4, vz: rnd(-0.4, 0.4), t: 0, life: rnd(0.25, 0.6) });
  }
  glitch.lastDark = d;
  for (let i = glitch.sparks.length - 1; i >= 0; i--) {
    const sp = glitch.sparks[i];
    sp.t += dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.z += sp.vz * dt; sp.vy += 3 * dt;
    if (sp.t > sp.life) glitch.sparks.splice(i, 1);
  }
}
function drawGlitchSparks() {
  if (!glitch.sparks.length) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const sp of glitch.sparks) {
    const pp = P(sp.x, sp.y, sp.z), a = 1 - sp.t / sp.life;
    const q = P(sp.x - sp.vx * 0.06, sp.y - sp.vy * 0.06, sp.z - sp.vz * 0.06);
    ctx.strokeStyle = `rgba(255,${Math.round(220 + 35 * a)},${Math.round(140 + 100 * a)},${a})`;
    ctx.lineWidth = Math.max(1.2, 3.2 * pp.s * a);
    ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(pp.x, pp.y); ctx.stroke();
  }
  // clarão elétrico no ponto da avaria enquanto a luz falha
  if (glitch.on && glitchDark() > 0.3) {
    const c = P(glitch.ex, glitch.ey, glitch.ez), r = 0.09 * c.s * K * rnd(0.7, 1.3);
    const g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.3, 'rgba(160,210,255,0.6)'); g.addColorStop(1, 'rgba(120,180,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// --- Tempo-bala (efeito "Matrix") ----------------------------------------------
// De vez em quando, depois de uma raquetada forte, a bola fica suspensa no ar uns instantes
// (tempo quase parado, chuva de código, câmara a rodar) e depois explode em velocidade.
const MX = { arm: null, on: false, phase: '', t: 0, m: 0, scale: 1, cool: 0, rain: [], ripples: 0, used: false };
const MX_CHARS = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ$#*+<>=';
function matrixArm(who, chance) {
  if (MX.on || MX.arm || MX.used || MX.cool > 0 || G.warp || Math.random() > chance) return;
  MX.arm = who;
}
function startMatrix() {
  MX.arm = null; MX.on = true; MX.phase = 'slow'; MX.t = 0; MX.used = true;
  // movimento de câmara diferente em cada tempo-bala
  const types = ['roll', 'orbit', 'dolly', 'pull', 'tilt'];
  let ty; do { ty = types[Math.floor(Math.random() * types.length)]; } while (ty === MX.lastCam && Math.random() < 0.85);
  MX.lastCam = ty;
  MX.cam = { type: ty, dir: Math.random() < 0.5 ? -1 : 1, amp: rnd(0.6, 1.2), f: rnd(0.8, 1.8), ph: rnd(0, 6.28) };
  MX.rain = [];
  const cols = Math.ceil(W / 16);
  for (let i = 0; i < cols; i++) MX.rain.push({ x: i * 16 + 8, y: rnd(-H, 0), v: rnd(140, 420), n: Math.floor(rnd(6, 18)), seed: Math.random() * 1000 });
  sfx.matrixIn();

}
function updateMatrix(dt) {
  MX.cool = Math.max(0, MX.cool - dt);
  if (!MX.on) { MX.scale = 1; MX.m = Math.max(0, MX.m - dt * 3); return; }
  MX.t += dt;
  for (const c of MX.rain) { c.y += c.v * dt; if (c.y - c.n * 16 > H) c.y = rnd(-120, 0); }
  if (MX.phase === 'slow') {
    const u = Math.min(1, MX.t / 0.4);
    MX.scale = 1 - 0.985 * easeIO(u); MX.m = u;
    if (u >= 1) { MX.phase = 'hold'; MX.t = 0; }
  } else if (MX.phase === 'hold') {
    MX.scale = 0.012; MX.m = 1;
    if (MX.t >= 1.2) {
      // explosão!
      MX.phase = 'after'; MX.t = 0; MX.scale = 1;
      ball.vz *= 1.55; ball.vx *= 1.2; ball.vy *= 1.2;
      ignite(1, ball.vz > 0 ? '120,255,150' : '255,80,60');
      G.shake = 0.5;
      addFlash(ball.x, ball.y, clamp(ball.z, 0, TD), '170,255,190', 5, 0.5);
      sfx.matrixOut();
      if (ball.vz > 0) { addScore(300); pop('BALA MATRIX +300', '#8dff9a'); }
    }
  } else if (MX.phase === 'after') {
    MX.m = Math.max(0, 1 - MX.t / 0.35);
    if (MX.t >= 0.35) { MX.on = false; MX.cool = 15; }
  }
}
function checkMatrixArm() {
  if (!MX.arm || G.mode !== 'play') return;
  if (MX.arm === 'me' && ball.vz > 0 && ball.z > TD * 0.32) startMatrix();
  else if (MX.arm === 'op' && ball.vz < 0 && ball.z < TD * 0.62) startMatrix();
}
function drawMatrix() {
  const m = MX.m;
  if (m <= 0.01) return;
  // tom verde
  ctx.fillStyle = `rgba(0,35,10,${0.38 * m})`; ctx.fillRect(0, 0, W, H);
  // ondas de choque à volta da bola suspensa
  if (MX.on && ball.visible && ball.z >= 0) {
    const pp = P(ball.x, ball.y, ball.z), r0 = BR * pp.s * K;
    const tt = performance.now() / 1000;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 3; k++) {
      const ph = ((tt * 1.4 + k / 3) % 1);
      ctx.strokeStyle = `rgba(140,255,170,${(1 - ph) * 0.6 * m})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(pp.x, pp.y, r0 * (1.5 + ph * 5), r0 * (1.5 + ph * 5) * 0.9, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }
  // chuva de código
  ctx.save();
  ctx.font = 'bold 14px "Courier New", monospace'; ctx.textAlign = 'center';
  const tick = Math.floor(performance.now() / 90);
  for (const c of MX.rain) {
    for (let i = 0; i < c.n; i++) {
      const y = c.y - i * 16;
      if (y < -16 || y > H + 16) continue;
      const ch = MX_CHARS[Math.floor((c.seed + i * 7 + tick * (i === 0 ? 1 : 0.2)) % MX_CHARS.length)];
      const a = (i === 0 ? 0.9 : 0.55 * (1 - i / c.n)) * m * 0.75;
      ctx.fillStyle = i === 0 ? `rgba(220,255,225,${a})` : `rgba(60,255,110,${a})`;
      ctx.fillText(ch, c.x, y);
    }
  }
  ctx.restore();
}

// --- Bola incandescente (remates e ataques fortes): rasto luminoso + faíscas ---
const fire = { k: 0, rgb: '255,200,90', trail: [], sparks: [] };
function ignite(k, rgb) { fire.k = k; fire.rgb = rgb; fire.trail.length = 0; }
function updateFire(dt) {
  if (G.mode === 'boom' && fire.k < 0.35) { fire.k = 0.35; fire.rgb = '200,225,255'; }   // rasto do bumerangue
  const active = fire.k > 0 && ball.visible && (G.mode === 'play' || G.mode === 'miss' || G.mode === 'boom');
  if (active) {
    fire.trail.push({ x: ball.x, y: ball.y, z: ball.z });
    if (fire.trail.length > 24) fire.trail.shift();
    const n = Math.random() < fire.k * 0.55 ? (fire.k > 0.8 && Math.random() < 0.4 ? 2 : 1) : 0;
    for (let i = 0; i < n; i++) fire.sparks.push({
      x: ball.x, y: ball.y, z: ball.z,
      vx: rnd(-0.7, 0.7) + ball.vx * 0.2, vy: rnd(-0.7, 0.4) + ball.vy * 0.2, vz: ball.vz * rnd(0.05, 0.35),
      t: 0, life: rnd(0.25, 0.55)
    });
  } else if (fire.trail.length) fire.trail.splice(0, 2);
  for (let i = fire.sparks.length - 1; i >= 0; i--) {
    const sp = fire.sparks[i];
    sp.t += dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.z += sp.vz * dt; sp.vy += 1.4 * dt;
    if (sp.t > sp.life) fire.sparks.splice(i, 1);
  }
  if (fire.sparks.length > 160) fire.sparks.splice(0, fire.sparks.length - 160);
  G.shake = Math.max(0, (G.shake || 0) - dt * 1.8);
}
function drawFire() {
  if (!fire.trail.length && !fire.sparks.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const n = fire.trail.length, k = Math.max(fire.k, 0.35);
  for (let i = 0; i < n; i++) {
    const q = fire.trail[i];
    if (q.z < -0.35) continue;
    const pp = P(q.x, q.y, q.z), f = (i + 1) / n;
    const r = BR * pp.s * K * (0.28 + 0.65 * f) * (1 + k * 0.32);
    const g = ctx.createRadialGradient(pp.x, pp.y, 0, pp.x, pp.y, r * 1.9);
    g.addColorStop(0, `rgba(255,255,235,${0.32 * f * k})`);
    g.addColorStop(0.35, `rgba(${fire.rgb},${0.23 * f * k})`);
    g.addColorStop(1, `rgba(${fire.rgb},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(pp.x, pp.y, r * 1.9, 0, Math.PI * 2); ctx.fill();
  }
  for (const sp of fire.sparks) {
    if (sp.z < -0.35) continue;
    const pp = P(sp.x, sp.y, sp.z), a = 1 - sp.t / sp.life;
    ctx.fillStyle = `rgba(255,${Math.round(200 + 55 * a)},${Math.round(120 + 100 * a)},${a * 0.8})`;
    ctx.beginPath(); ctx.arc(pp.x, pp.y, Math.max(0.7, 1.9 * pp.s * a), 0, Math.PI * 2); ctx.fill();
  }
  // halo pulsante em volta da bola
  if (fire.k > 0 && ball.visible && ball.z > -0.35) {
    const pp = P(ball.x, ball.y, ball.z), r = BR * pp.s * K;
    const pulse = 1 + 0.1 * Math.sin(performance.now() / 45);
    const g = ctx.createRadialGradient(pp.x, pp.y, r * 0.55, pp.x, pp.y, r * 2.5 * pulse);
    g.addColorStop(0, `rgba(255,250,220,${0.4 * fire.k})`);
    g.addColorStop(0.42, `rgba(${fire.rgb},${0.25 * fire.k})`);
    g.addColorStop(1, `rgba(${fire.rgb},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(pp.x, pp.y, r * 2.5 * pulse, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// bola em brasa durante um remate
function drawBallHeat() {
  if (fire.k <= 0 || !ball.visible || ball.z < -0.35) return;
  const pp = P(ball.x, ball.y, ball.z), r = BR * pp.s * K;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(pp.x, pp.y, 0, pp.x, pp.y, r * 1.1);
  g.addColorStop(0, `rgba(255,255,240,${0.6 * fire.k})`);
  g.addColorStop(1, `rgba(${fire.rgb},${0.28 * fire.k})`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pp.x, pp.y, r * 1.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// linhas da parede frontal de squash (proporções reais: parede 4,57 m, linha de serviço 1,78 m, tábua 0,48 m)
function drawSquashLines() {
  if (!SQUASH) return;
  const H2 = 2 * TY, yAt = m => TY - H2 * m / 4.57;
  const f = rectAt(TD), sc = P(0, 0, TD).s * K;
  ctx.save();
  ctx.globalAlpha = Math.min(1, fogAt(TD) * 1.2);
  ctx.shadowColor = 'rgba(255,60,50,0.7)'; ctx.shadowBlur = 6;
  ctx.strokeStyle = 'rgba(235,45,40,0.95)';
  const line = (m, w) => { const y = P(0, yAt(m), TD).y; ctx.lineWidth = Math.max(1.5, w * sc); ctx.beginPath(); ctx.moveTo(f.x, y); ctx.lineTo(f.x + f.w, y); ctx.stroke(); };
  line(4.45, 0.02);                                   // linha de fora (topo)
  line(1.78, 0.02);                                   // linha de serviço
  // tábua (tin): faixa inferior com a linha vermelha por cima
  const yt = P(0, yAt(0.48), TD).y;
  ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(200,40,35,0.18)';
  ctx.fillRect(f.x, yt, f.w, f.y + f.h - yt);
  ctx.shadowBlur = 6; line(0.48, 0.03);
  ctx.restore();
}

// lança-bolas: tripé, corpo metálico e canhão que roda para onde vai disparar, com clarão no disparo
function drawMachine() {
  const c = P(0, MC_Y, TD), s = c.s * K, R = 0.17 * s;
  ctx.save();
  ctx.globalAlpha = Math.min(1, fogAt(TD) * 1.15);
  ctx.strokeStyle = '#5c6670'; ctx.lineWidth = Math.max(2, 0.03 * s); ctx.lineCap = 'round';
  for (const lx of [-0.2, 0, 0.2]) { const f = P(lx, TY, TD + (lx === 0 ? 0.15 : 0)); ctx.beginPath(); ctx.moveTo(c.x, c.y + R * 0.6); ctx.lineTo(f.x, f.y); ctx.stroke(); }
  const g = ctx.createRadialGradient(c.x - R * 0.35, c.y - R * 0.4, R * 0.1, c.x, c.y, R);
  g.addColorStop(0, '#c9d3dc'); g.addColorStop(0.5, '#5d6a76'); g.addColorStop(1, '#1d242b');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, R, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(120,220,255,0.6)'; ctx.lineWidth = Math.max(1, 0.012 * s);
  ctx.beginPath(); ctx.arc(c.x, c.y, R * 0.92, 0, Math.PI * 2); ctx.stroke();
  // canhão: a boca desloca-se na direção do alvo
  const mx = c.x + MC.ax * 0.09 * s, my = c.y + MC.ay * 0.07 * s, mr = 0.075 * s;
  const gb = ctx.createRadialGradient(mx, my, mr * 0.2, mx, my, mr * 1.3);
  gb.addColorStop(0, '#2a3138'); gb.addColorStop(1, '#8a97a3');
  ctx.fillStyle = gb; ctx.beginPath(); ctx.arc(mx, my, mr * 1.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#05080b'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
  if (MC.flash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    const fg = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 3);
    fg.addColorStop(0, `rgba(255,240,200,${MC.flash})`); fg.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(mx, my, mr * 3, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  // luzes de estado a piscar
  const blink = (performance.now() / 250 | 0) % 2;
  ctx.fillStyle = blink ? 'rgba(80,255,140,0.9)' : 'rgba(80,255,140,0.3)';
  ctx.beginPath(); ctx.arc(c.x - R * 0.6, c.y + R * 0.55, Math.max(1.5, R * 0.07), 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = G.mode === 'serve' ? 'rgba(255,90,70,0.95)' : 'rgba(255,90,70,0.3)';
  ctx.beginPath(); ctx.arc(c.x + R * 0.6, c.y + R * 0.55, Math.max(1.5, R * 0.07), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// alvo (modo tiro ao alvo): anéis como no tiro com arco, com brilho; abana quando é atingido
function drawTarget() {
  const sh = TG.shake, jx = sh ? Math.sin(performance.now() * 0.06) * 0.012 * sh : 0, jy = sh ? Math.cos(performance.now() * 0.075) * 0.008 * sh : 0;
  const c = P(op.x + jx, op.y + jy, TD), R = tgR() * c.s * K;
  const cols = ['#f2f2f2', '#1c1c22', '#2f86f0', '#e8433c', '#ffd23f'];   // de fora para dentro
  ctx.save();
  ctx.shadowColor = 'rgba(255,220,120,0.6)'; ctx.shadowBlur = R * 0.35;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.arc(c.x, c.y, R * (1 - i / 5), 0, Math.PI * 2);
    ctx.fillStyle = cols[i]; ctx.fill();
    if (i === 0) ctx.shadowBlur = 0;
    ctx.strokeStyle = i === 1 ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.35)'; ctx.lineWidth = Math.max(1, R * 0.02); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(1, R * 0.025), 0, Math.PI * 2); ctx.fill();   // mosca
  ctx.restore();
}

// a tua baliza (penáltis): postes e trave junto a ti, discretos, para se perceber quando a bola bate nos ferros
function drawGoalNear() {
  if (!PENALTY) return;
  const a1 = P(-GX, TY, 0), a2 = P(-GX, -GY, 0), a3 = P(GX, -GY, 0), a4 = P(GX, TY, 0);
  ctx.save();
  ctx.strokeStyle = 'rgba(245,248,255,0.4)'; ctx.lineWidth = Math.max(4, 1.2 * GPR * K); ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(255,255,255,0.5)'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y); ctx.lineTo(a3.x, a3.y); ctx.lineTo(a4.x, a4.y); ctx.stroke();
  ctx.restore();
}

// baliza (modo grandes penalidades): postes, trave e rede a ocupar toda a parede do fundo
function drawGoal() {
  if (!PENALTY) return;
  const zr = TD + 0.3;                      // fundo da rede (atrás da parede)
  ctx.save();
  // rede do fundo: malha em losango (ondula com o golo)
  ctx.strokeStyle = 'rgba(235,240,245,0.3)'; ctx.lineWidth = 1;
  ctx.beginPath();
  const st = 2 * GX / 28, n = PEN.rip ? 18 : 1;
  for (const sg of [1, -1]) {               // famílias x − y = c e x + y = c
    for (let c = -(GX + TY) - st; c <= GX + TY + st; c += st) {
      // segmento da reta dentro do retângulo [-GX, GX] × [-GY, TY]
      let x0, x1;
      if (sg === 1) { x0 = Math.max(-GX, c - GY); x1 = Math.min(GX, c + TY); }
      else { x0 = Math.max(-GX, c - TY); x1 = Math.min(GX, c + GY); }
      if (x1 <= x0) continue;
      for (let i = 0; i <= n; i++) {
        const x = x0 + (x1 - x0) * i / n, y = sg === 1 ? x - c : c - x;
        const bz = netBulge(x, y), k = clamp(bz * 2.4, -0.25, 0.65), r = PEN.rip;   // a malha é puxada para o ponto do impacto
        const q = r ? P(x + (r.x - x) * k, y + (r.y - y) * k + Math.abs(bz) * 0.3, zr + bz) : P(x, y, zr);
        if (i) ctx.lineTo(q.x, q.y); else ctx.moveTo(q.x, q.y);
      }
    }
  }
  ctx.stroke();
  // redes laterais e de cima: linhas de profundidade do aro até ao fundo
  ctx.strokeStyle = 'rgba(235,240,245,0.22)';
  ctx.beginPath();
  for (let k = 0; k <= 6; k++) {
    const u = k / 6, yy = -GY + u * (TY + GY), xx = -GX + u * 2 * GX;
    for (const [x1, y1] of [[-GX, yy], [GX, yy], [xx, -GY]]) {
      const p1 = P(x1, y1, TD), p2 = P(x1, y1, zr + netBulge(x1, y1) * 0.8);
      ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
    }
  }
  for (const [x1, y1, x2, y2] of [[-GX, -GY, GX, -GY], [-GX, -GY, -GX, TY], [GX, -GY, GX, TY]]) {   // aro de trás
    const p1 = P(x1, y1, zr), p2 = P(x2, y2, zr); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
  }
  ctx.stroke();
  // postes e trave (brancos, com brilho)
  const a1 = P(-GX, TY, TD), a2 = P(-GX, -GY, TD), a3 = P(GX, -GY, TD), a4 = P(GX, TY, TD);
  ctx.shadowColor = 'rgba(255,255,255,0.8)'; ctx.shadowBlur = 8;
  ctx.strokeStyle = 'rgba(250,252,255,0.95)'; ctx.lineWidth = Math.max(3, 2 * GPR * P(0, 0, TD).s * K);
  ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(a1.x, a1.y); ctx.lineTo(a2.x, a2.y); ctx.lineTo(a3.x, a3.y); ctx.lineTo(a4.x, a4.y);
  ctx.stroke();
  ctx.restore();
}

// rede: malha translúcida com fita branca no topo e postes nos lados
// rede do meio a abanar depois de a bola lá bater (empurrada no sentido da bola, amortece)
function netWave(x, y) {
  const r = NET && NET.rip; if (!r) return 0;
  const g = Math.exp(-((x - r.x) ** 2 + (y - r.y) ** 2) / 0.22);
  const fix = clamp((TY - y) / (TY - NET.top), 0, 1);                          // presa no chão, solta em cima
  const on = 1 - Math.exp(-r.t * 25);
  return r.d * on * fix * (0.2 * g * Math.exp(-1.8 * r.t) * Math.cos(9 * r.t)
                         + 0.06 * Math.exp(-1.5 * r.t) * Math.cos(7 * r.t + 0.5) * (0.5 + 0.5 * Math.cos((x - r.x) * 2.5)));
}
function drawNet() {
  if (!NET) return;
  const zm = TD / 2, top = NET.top;
  const a = P(-TX, top, zm), b = P(TX, TY, zm);
  const wv = !!NET.rip, NX = wv ? 30 : 1, NY = wv ? 10 : 1;
  const line = (x0, y0, x1, y1, n) => {
    for (let i = 0; i <= n; i++) {
      const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n, w = netWave(x, y), q = P(x, y + Math.abs(w) * 0.45, zm + w);
      if (i) ctx.lineTo(q.x, q.y); else ctx.moveTo(q.x, q.y);
    }
  };
  ctx.save();
  ctx.globalAlpha = fogAt(zm);
  ctx.fillStyle = 'rgba(20,30,40,0.25)';
  ctx.fillRect(a.x, a.y, b.x - a.x, b.y - a.y);
  ctx.strokeStyle = 'rgba(220,235,245,0.28)'; ctx.lineWidth = 1;
  ctx.beginPath();
  const step = 0.05;
  for (let x = -TX; x <= TX + 1e-6; x += step) line(x, top, x, TY, NY);
  for (let y = top; y <= TY + 1e-6; y += step) line(-TX, y, TX, y, NX);
  ctx.stroke();
  // fita do topo
  ctx.strokeStyle = 'rgba(250,252,255,0.95)'; ctx.lineWidth = Math.max(2, 0.025 * P(0, 0, zm).s * K);
  ctx.beginPath(); line(-TX, top, TX, top, NX); ctx.stroke();
  // postes
  ctx.strokeStyle = 'rgba(180,190,200,0.9)'; ctx.lineWidth = Math.max(2, 0.03 * P(0, 0, zm).s * K);
  ctx.beginPath(); ctx.moveTo(a.x, a.y - 2); ctx.lineTo(a.x, b.y); ctx.moveTo(b.x, a.y - 2); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.restore();
}

function drawBall() {
  if (!ball.visible) return;
  const p = P(ball.x, ball.y, ball.z);
  const r = BR * p.s * K;
  if (r < 0.5) return;
  if (TIMED) { drawGrenade(p, r); return; }       // cronometrado: a bola é uma granada
  const depth = clamp(ball.z / TD, 0, 1);
  ctx.save();
  ctx.globalAlpha = (G.mode === 'boom' ? 1 : ball.z > TD ? clamp(1 - (ball.z - TD) / (PENALTY ? 1.4 : 0.6), 0, 1) : 1) * fogAt(Math.min(ball.z, TD));
  const h = Math.round(ballHue);
  ctx.shadowColor = `hsla(${h},100%,65%,0.8)`;
  ctx.shadowBlur = r * (DISCO ? 1.8 : 0.9);      // discoteca: brilho mais forte para se ver bem no escuro
  const g = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.4, r * 0.08, p.x, p.y, r);
  g.addColorStop(0, `hsl(${h},40%,${Math.round(98 - depth * 22)}%)`);
  g.addColorStop(0.35, `hsl(${h},100%,${Math.round(82 - depth * 16)}%)`);
  g.addColorStop(0.8, `hsl(${h},75%,${Math.round(48 - depth * 12)}%)`);
  g.addColorStop(1, `hsl(${h},75%,${Math.round(22 - depth * 6)}%)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // costura que roda — mostra visualmente o efeito aplicado
  if (r > 3) {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.clip();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.atan2(ball.cy, ball.cx || 1e-6));
    ctx.strokeStyle = `hsla(${h},75%,20%,0.55)`;
    ctx.lineWidth = Math.max(1, r * 0.09);
    for (let k = 0; k < 2; k++) {
      const ph = ball.rot + k * Math.PI;
      const s = Math.sin(ph);
      if (s <= 0) continue;
      ctx.beginPath();
      ctx.ellipse(r * Math.cos(ph) * 0.92, 0, Math.max(0.5, r * 0.35 * s), r * 0.98, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function txt(s, x, y, size, color, align = 'center', glow = 0, weight = 'bold') {
  ctx.font = `${weight} ${size}px "Courier New", Courier, monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
}

function drawLives(n, max, x, y, dir, rgb) {
  const r = Math.max(4, W * 0.011);
  for (let i = 0; i < max; i++) {
    const cx = x + dir * i * r * 2.7;
    ctx.beginPath(); ctx.arc(cx, y, r, 0, Math.PI * 2);
    if (i < n) {
      const g = ctx.createRadialGradient(cx - r * 0.3, y - r * 0.3, r * 0.1, cx, y, r);
      g.addColorStop(0, '#fff'); g.addColorStop(1, `rgb(${rgb})`);
      ctx.fillStyle = g; ctx.fill();
    } else {
      ctx.strokeStyle = `rgba(${rgb},0.35)`; ctx.lineWidth = 1; ctx.stroke();
    }
  }
}

function drawHUD() {
  const fs = Math.max(12, Math.min(W * 0.035, Math.max(W, H) * 0.024));   // ao alto: letra um pouco maior
  const top = H * 0.045;
  txt('PONTOS ' + G.score, W * 0.04, top, fs, '#dff6ff', 'left', 6);
  txt('NÍVEL ' + G.level, W / 2, top, fs, '#b6ff7a', 'center', 6);

  const sa = 0.5 + 0.5 * L.dk;
  for (const q of pts) {
    const pe = P(q.x, q.y, q.z), r = Math.max(1.5, (0.04 + 0.02 * L.dk) * pe.s * K), a = sa * fogAt(q.z);
    const g = ctx.createRadialGradient(pe.x, pe.y, 0, pe.x, pe.y, r);
    g.addColorStop(0, `hsla(${q.h},100%,85%,${a})`); g.addColorStop(1, `hsla(${q.h},100%,60%,0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pe.x, pe.y, r, 0, Math.PI * 2); ctx.fill();
  }
  // flash colorido no tempo forte (moderado)
  // banho de cor que muda a cada compasso (mais forte às escuras) + flash colorido no bombo
  const hue = (Math.floor(L.beat / 4) * 97) % 360;
  ctx.fillStyle = `hsla(${hue},100%,45%,${0.05 + 0.1 * L.dk})`; ctx.fillRect(-20, -20, W + 40, H + 40);
  if (L.fl > 0) { ctx.fillStyle = `hsla(${(L.beat * 67) % 360},100%,62%,${0.22 * L.fl})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();
  // bola de espelhos: fio do teto, esfera e facetas a cintilar enquanto roda
  const R = 0.12 * pm.s * K, top = P(0, -TY, M.z);
  ctx.save();
  ctx.globalAlpha = fogAt(M.z);
  ctx.strokeStyle = 'rgba(200,210,220,0.7)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(pm.x, pm.y - R); ctx.stroke();
  const gb = ctx.createRadialGradient(pm.x - R * 0.3, pm.y - R * 0.3, R * 0.1, pm.x, pm.y, R);
  gb.addColorStop(0, '#d8dde4'); gb.addColorStop(0.6, '#7a828c'); gb.addColorStop(1, '#2a2e34');
  ctx.fillStyle = gb; ctx.beginPath(); ctx.arc(pm.x, pm.y, R, 0, Math.PI * 2); ctx.fill();
  for (let k = -5; k <= 5; k++) {
    const lat = k * Math.PI / 12, cl = Math.cos(lat), n = Math.max(4, Math.round(22 * cl));
    for (let j = 0; j < n; j++) {
      const lon = j * 2 * Math.PI / n + rot, zf = cl * Math.cos(lon);
      if (zf < 0.08) continue;
      const fx = pm.x + cl * Math.sin(lon) * R, fy = pm.y + Math.sin(lat) * R, sz = Math.max(1, R * 0.12 * (0.4 + 0.6 * zf));
      const hsh = Math.sin(k * 12.9898 + j * 78.233) * 43758.5453 % 1;
      const sp = Math.pow(Math.max(0, Math.sin(rot * 4 + hsh * 30)), 12);
      ctx.fillStyle = sp > 0.3 ? `rgba(255,255,255,${0.6 + 0.4 * sp})` : `rgba(${160 + 60 * zf | 0},${170 + 60 * zf | 0},${185 + 60 * zf | 0},0.85)`;
      ctx.fillRect(fx - sz / 2, fy - sz / 2, sz, sz);
      if (sp > 0.85) { ctx.fillStyle = `rgba(255,255,255,${(sp - 0.85) * 4})`; ctx.fillRect(fx - sz * 1.5, fy - 0.5, sz * 3, 1); ctx.fillRect(fx - 0.5, fy - sz * 1.5, 1, sz * 3); }
    }
  }
  ctx.restore();
}

function draw() {
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-1, 1) * G.shake * 14, rnd(-1, 1) * G.shake * 10);   // tremor do remate
  if (MX.m > 0.01 && MX.cam) {     // tempo-bala: movimento de câmara (varia de cada vez)
    const c = MX.cam, m = MX.m, tt = MX.on ? MX.t + (MX.phase === 'hold' ? 0.4 : 0) : 1.6;
    const bp = P(ball.x, ball.y, clamp(ball.z, 0, TD));
    let ang = 0, zoom = 1, fx = CX, fy = CY;
    if (c.type === 'roll')  { ang = c.dir * 0.16 * c.amp * Math.min(1, tt / 1.6) * m; zoom = 1 + 0.04 * m; }        // rola devagar para um lado
    if (c.type === 'orbit') { ang = Math.sin(tt * c.f * 2 + c.ph) * 0.07 * c.amp * m; zoom = 1 + 0.06 * m; }      // balança
    if (c.type === 'dolly') { zoom = 1 + 0.22 * c.amp * Math.min(1, tt / 1.6) * m; fx = bp.x; fy = bp.y; }        // aproxima-se da bola
    if (c.type === 'pull')  { zoom = 1 - 0.1 * c.amp * Math.min(1, tt / 1.6) * m; ang = c.dir * 0.03 * m; }       // afasta-se
    if (c.type === 'tilt')  { ang = c.dir * 0.1 * c.amp * m; zoom = 1 + 0.12 * m; fx = bp.x; fy = bp.y; }          // inclina e centra na bola
    ctx.translate(fx, fy); ctx.rotate(ang); ctx.scale(zoom, zoom); ctx.translate(-fx, -fy);
  }
  drawTunnel();
  const gd = glitchDark();
  if (gd > 0) { ctx.fillStyle = `rgba(0,0,0,${gd})`; ctx.fillRect(-20, -20, W + 40, H + 40); }   // luzes do túnel a falhar
  drawDisco();
  const behind = ball.z > TD;
  if (behind) drawBall();
  drawSquashLines();
  drawGoal();
  ctx.globalAlpha = fogAt(TD) * 1.15 > 1 ? 1 : fogAt(TD) * 1.15;    // névoa: o adversário quase some ao fundo
  if (TARGET) drawTarget();
  else if (MACH) drawMachine();
  else if (!SQUASH) drawRacketRig(rigOp, op.x, op.y, TD - rigOp.z, PAL.op, TD);
  const sqOp = () => { ctx.save(); ctx.globalAlpha = 0.55; drawRacketRig(rigOp, op.x, op.y, SQZ - rigOp.z * 0.3, PAL.op); ctx.restore(); };
  if (SQUASH && ball.z <= SQZ) sqOp();
  ctx.globalAlpha = 1;
  drawFlashes();
  drawDepthRing();
  drawFire();
  drawExplosion();
  const inFront = ball.z < 0;
  // a bola vê-se à frente ou atrás da rede, conforme o lado em que está
  if (!behind && !inFront) {
    if (NET && ball.z > TD / 2) { drawBall(); drawBallHeat(); drawNet(); }
    else { drawNet(); drawBall(); drawBallHeat(); }
  } else drawNet();
  if (SQUASH && ball.z > SQZ) sqOp();    // squash: o adversário está à tua frente (bola atrás dele)
  if (G.mode !== 'title') drawRacketRig(rigMe, me.x, me.y, rigMe.z, PAL.me);
  if (inFront) { drawBall(); drawBallHeat(); }
  if (gd > 0) { ctx.fillStyle = `rgba(0,0,0,${gd * 0.5})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  if (VIS[visIdx].vign > 0) {     // escuridão nas margens (visibilidade reduzida)
    const vg = ctx.createRadialGradient(CX, CY, Math.min(W, H) * 0.22, CX, CY, Math.max(W, H) * 0.62);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${VIS[visIdx].vign})`);
    ctx.fillStyle = vg; ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  drawGoalNear();
  drawGlitchSparks();
  ctx.restore();
  drawMatrix();
  if (G.mode !== 'title') drawHUD();
  if (gd > 0) { ctx.fillStyle = `rgba(0,0,0,${gd * 0.6})`; ctx.fillRect(0, 0, W, H); }
  drawOverlays();
}

// --- Ciclo principal -------------------------------------------------------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  if (!G.paused) { updateMatrix(dt); G.rdt = dt; update(dt * MX.scale); updateDisco(dt); }
  updateFlightSound();
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__curveball = { TUN, G, ball, me, op, input, AI, rigMe, rigOp, sd: strokeDelta, glitch, startGlitch, setTheme: i => { themeIdx = i; }, PEN, penWinner, penResult, setDisco: v => { DISCO = v; }, DSC, setTimed: v => { TIMED = v; }, TM, EXP, boomGrenade, setTarget: v => { TARGET = v; tgReset(); }, TG, setRound: v => { ROUND = v; }, predictArrival, setMach: v => { MACH = v; mcReset(); }, setNextMode: i => { FORCE_NEXT = i; }, MC, mcNeed, tgCurveK, tgR, tgNeed, setPenalty: v => { PENALTY = v; penReset(); }, setSquash: v => { SQUASH = v; }, tryBoomerang, setNet: n => { NET = n; }, MX, startMatrix, LOCK, setVis: i => { visIdx = i; }, shotMemory, observe: aiObserve, step: update, setTD: d => { TD = TD_TARGET = d; }, audio: () => ({ hit: !!HITBUF, ok: !!SWOOSH, peak: SW_PEAK, dur: SWOOSH ? SWOOSH.duration : 0 }) };
})();
</script>
